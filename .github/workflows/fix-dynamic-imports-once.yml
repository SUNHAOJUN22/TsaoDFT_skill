name: Apply exact dynamic-import annotations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dynamic-imports-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply exact annotations and verify Ruff
        run: |
          python .github/fix-dynamic-imports-once.py
          python -m ruff check .
          python -m ruff format --check .

      - name: Remove one-time files and commit
        run: |
          rm .github/fix-dynamic-imports-once.py
          rm .github/workflows/fix-dynamic-imports-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: annotate intentional dynamic imports [skip ci]'
          git push origin HEAD:main

name: One-shot release coverage typing closure

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-release-coverage-typing
  cancel-in-progress: false

jobs:
  repair:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: retry release coverage typing' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/release-coverage-typing \
            -f description="Release coverage typing closure running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Apply line-structured test typing fixes
        run: |
          rm -f .github/coverage_repair_payload.py
          python - <<'PY'
          from pathlib import Path
          path = Path('skills/tsao-dft-hpc-provenance/tests/test_release_core_coverage.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          argv_loop = next(i for i, line in enumerate(lines) if 'for value in (None, [], ["python", ""]' in line)
          lines[argv_loop] = lines[argv_loop].replace('for value in', 'for argv_value in', 1)
          argv_call = next(i for i in range(argv_loop + 1, min(argv_loop + 5, len(lines))) if 'self.shell.validate_argv(value,' in lines[i])
          lines[argv_call] = lines[argv_call].replace('validate_argv(value,', 'validate_argv(argv_value,', 1)
          empty_line = next(i for i, line in enumerate(lines) if 'empty = Path(temporary) / "empty"' in line)
          if empty_line == 0 or 'TemporaryDirectory() as temporary' not in lines[empty_line - 1]:
              raise SystemExit('empty directory context target changed')
          lines[empty_line - 1] = lines[empty_line - 1].replace('as temporary:', 'as empty_dir:', 1)
          lines[empty_line] = lines[empty_line].replace('Path(temporary)', 'Path(empty_dir)', 1)
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          python -m ruff check --fix skills/tsao-dft-hpc-provenance/tests/test_release_core_coverage.py
          python -m ruff format skills/tsao-dft-hpc-provenance/tests/test_release_core_coverage.py

      - name: Run complete gate against permanent CI
        shell: bash
        run: |
          set -o pipefail
          git checkout c6adf6432d26cbe337a83abf775a590edaa2dc1b -- .github/workflows/ci.yml
          python scripts/quality_gate.py 2>&1 | tee release-coverage-typing-quality.log
          git checkout HEAD -- .github/workflows/ci.yml

      - name: Commit, rebase, revalidate and push code
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: close release trust-core typing gaps"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git checkout c6adf6432d26cbe337a83abf775a590edaa2dc1b -- .github/workflows/ci.yml
            python scripts/quality_gate.py 2>&1 | tee "release-coverage-typing-rebased-${attempt}.log"
            git checkout HEAD -- .github/workflows/ci.yml
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Release coverage typing closure failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Release coverage typing closure passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/release-coverage-typing \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-coverage-typing-${{ github.sha }}
          path: release-coverage-typing-*.log
          if-no-files-found: warn
          retention-days: 14

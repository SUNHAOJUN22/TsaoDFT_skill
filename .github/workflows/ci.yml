name: One-shot release-core test push

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-release-core-test-push
  cancel-in-progress: false

jobs:
  finalize:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: push release-core tests without workflow changes' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/release-core-test-push \
            -f description="Release-core tests running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Add final validator paths and normalize tests
        run: |
          cat > skills/tsao-dft-hpc-provenance/tests/test_release_validator_final.py <<'PY'
          from __future__ import annotations

          import copy
          import importlib.util
          import unittest
          from pathlib import Path
          from typing import Any

          import yaml

          ROOT = Path(__file__).resolve().parents[1]


          def load_validator() -> Any:
              path = ROOT / "scripts/validate_hpc_manifest.py"
              spec = importlib.util.spec_from_file_location("release_validator_final", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot import {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          class ReleaseValidatorFinalTests(unittest.TestCase):
              validator: Any
              base: dict[str, Any]

              @classmethod
              def setUpClass(cls) -> None:
                  cls.validator = load_validator()
                  cls.base = yaml.safe_load((ROOT / "templates/hpc-manifest.yaml").read_text(encoding="utf-8"))

              def test_enabled_acceleration_requires_non_none_identity(self) -> None:
                  manifest = copy.deepcopy(self.base)
                  manifest["resources"].update({"gpus_per_node": 1, "tasks_per_node": 1})
                  manifest["acceleration"].update(
                      {
                          "enabled": True,
                          "backend": "none",
                          "mode": "none",
                          "gpu_vendor": "none",
                      }
                  )
                  errors: list[str] = []
                  warnings: list[str] = []
                  self.validator.validate_acceleration(manifest, manifest["resources"], errors, warnings)
                  self.assertTrue(any("non-none backend" in error for error in errors))

              def test_non_mapping_variables_and_approved_error_are_rejected(self) -> None:
                  manifest = copy.deepcopy(self.base)
                  manifest["environment"]["variables"] = ["bad"]
                  manifest["approval"] = "approved"
                  errors, _ = self.validator.validate(manifest)
                  self.assertIn("environment.variables must be a mapping", errors)
                  self.assertIn("approved manifest has validation errors", errors)


          if __name__ == "__main__":
              unittest.main()
          PY
          python -m ruff check --fix \
            skills/tsao-dft-hpc-provenance/tests/test_release_core_remaining.py \
            skills/tsao-dft-hpc-provenance/tests/test_release_validator_final.py \
            tests/test_release_validator_integration.py
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/tests/test_release_core_remaining.py \
            skills/tsao-dft-hpc-provenance/tests/test_release_validator_final.py \
            tests/test_release_validator_integration.py

      - name: Stage permanent CI for governance validation
        run: git checkout 9350932d24157b9d62b22e72c94bad9d28a427ba -- .github/workflows/ci.yml

      - name: Run targeted lint type and unit tests
        run: |
          python -m ruff check \
            skills/tsao-dft-hpc-provenance/tests/test_release_core_remaining.py \
            skills/tsao-dft-hpc-provenance/tests/test_release_validator_final.py \
            tests/test_release_validator_integration.py
          python -m ruff format --check \
            skills/tsao-dft-hpc-provenance/tests/test_release_core_remaining.py \
            skills/tsao-dft-hpc-provenance/tests/test_release_validator_final.py \
            tests/test_release_validator_integration.py
          python -m mypy \
            skills/tsao-dft-hpc-provenance/tests/test_release_core_remaining.py \
            skills/tsao-dft-hpc-provenance/tests/test_release_validator_final.py \
            tests/test_release_validator_integration.py
          python -m unittest discover -s skills/tsao-dft-hpc-provenance/tests -p 'test_release_core_remaining.py' -v
          python -m unittest discover -s skills/tsao-dft-hpc-provenance/tests -p 'test_release_validator_final.py' -v
          python -m unittest discover -s tests -p 'test_release_validator_integration.py' -v

      - name: Commit and push test files only
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/ci.yml
          git add \
            skills/tsao-dft-hpc-provenance/tests/test_release_core_remaining.py \
            skills/tsao-dft-hpc-provenance/tests/test_release_validator_final.py \
            tests/test_release_validator_integration.py
          git commit -m "test: finalize release-core coverage closure"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Release-core test push failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Release-core tests passed and were pushed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/release-core-test-push \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc" >
<title id="title">DFT + ML active-learning loop</title><desc id="desc">Synthetic active-learning workflow with validation and stop rules; not scientific data.</desc>
<defs><pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#E9EEF5"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0B1220" flood-opacity=".08"/></filter></defs><style>
.text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0B1220}
.mono{font-family:JetBrains Mono,SFMono-Regular,Consolas,monospace;fill:#0B1220}
.eyebrow{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:800;letter-spacing:1.8px;fill:#2563EB}
.title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:32px;font-weight:780;letter-spacing:-.7px;fill:#0B1220}
.h2{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:760;fill:#0B1220}
.body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:450;fill:#526175}
.small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:500;fill:#526175}
.tiny{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:10px;font-weight:650;letter-spacing:.5px;fill:#7A889B}
.label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.9px;fill:#526175}
.mono12{font-family:JetBrains Mono,SFMono-Regular,Consolas,monospace;font-size:12px;font-weight:600;fill:#0B1220}
</style>
<rect x="0" y="0" width="1080" height="480" rx="0" fill="#F6F8FC"/><text x="30" y="40" class="eyebrow">ACTIVE LEARNING</text><text x="30" y="76" class="title">Selection is a decision rule—not scientific acceptance.</text><rect x="108" y="140" width="164" height="80" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="190" y="174" class="label" text-anchor="middle">CANDIDATES</text><text x="190" y="198" class="small" text-anchor="middle">identity + constraints</text><rect x="338" y="90" width="164" height="80" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/><text x="420" y="124" class="label" text-anchor="middle">SURROGATE</text><text x="420" y="148" class="small" text-anchor="middle">uncertainty + domain</text><rect x="608" y="140" width="164" height="80" rx="16" fill="#FFFFFF" stroke="#6D5DFB" stroke-width="2"/><text x="690" y="174" class="label" text-anchor="middle">ACQUISITION</text><text x="690" y="198" class="small" text-anchor="middle">objective + diversity</text><rect x="608" y="280" width="164" height="80" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="690" y="314" class="label" text-anchor="middle">DFT RUN</text><text x="690" y="338" class="small" text-anchor="middle">reviewed method</text><rect x="338" y="330" width="164" height="80" rx="16" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/><text x="420" y="364" class="label" text-anchor="middle">VALIDATE</text><text x="420" y="388" class="small" text-anchor="middle">technical + scientific</text><rect x="108" y="280" width="164" height="80" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="190" y="314" class="label" text-anchor="middle">DATASET</text><text x="190" y="338" class="small" text-anchor="middle">accepted labels only</text><line x1="272" y1="180" x2="338" y2="146" stroke="#D9E2EE" stroke-width="3"/><circle cx="338" cy="146" r="4" fill="#0B1220"/><line x1="502" y1="130" x2="608" y2="146" stroke="#D9E2EE" stroke-width="3"/><circle cx="608" cy="146" r="4" fill="#0B1220"/><line x1="772" y1="220" x2="720" y2="280" stroke="#D9E2EE" stroke-width="3"/><circle cx="720" cy="280" r="4" fill="#0B1220"/><line x1="690" y1="360" x2="502" y2="370" stroke="#D9E2EE" stroke-width="3"/><circle cx="502" cy="370" r="4" fill="#0B1220"/><line x1="338" y1="370" x2="272" y2="336" stroke="#D9E2EE" stroke-width="3"/><circle cx="272" cy="336" r="4" fill="#0B1220"/><line x1="108" y1="320" x2="160" y2="220" stroke="#D9E2EE" stroke-width="3"/><circle cx="160" cy="220" r="4" fill="#0B1220"/><rect x="850" y="120" width="198" height="260" rx="16" fill="#101A2D"/><text x="874" y="152" class="eyebrow" style="fill:#93C5FD">STOP RULES</text><circle cx="876" cy="190" r="5" fill="#2563EB"/><text x="892" y="195" class="small" style="fill:#D7E4F5">budget reached</text><circle cx="876" cy="232" r="5" fill="#0891B2"/><text x="892" y="237" class="small" style="fill:#D7E4F5">uncertainty plateau</text><circle cx="876" cy="274" r="5" fill="#16A34A"/><text x="892" y="279" class="small" style="fill:#D7E4F5">domain covered</text><circle cx="876" cy="316" r="5" fill="#DC2626"/><text x="892" y="321" class="small" style="fill:#D7E4F5">failure rate high</text><text x="1052" y="462" class="tiny" text-anchor="end">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>
name: One-shot real-evidence typing closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-real-evidence-typing.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install locked Ruff
        run: python -m pip install "ruff==0.15.22"
      - name: Apply typed evidence boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py")
          text = path.read_text(encoding="utf-8")
          old = '    value = mapping.get(key)\n    if isinstance(value, bool):\n'
          new = '    value = mapping.get(key)\n    if value is None or isinstance(value, bool):\n'
          assert text.count(old) == 2
          text = text.replace(old, new)
          marker = '''    return result


def parse_scalar(value: str) -> Any:
'''
          helper = '''    return result


def performance_float(record: dict[str, Any], key: str) -> float:
    value = (record.get("performance") or {}).get(key)
    if isinstance(value, bool) or not isinstance(value, (int, float)):
        raise ValueError(f"validated performance field is not numeric: {key}")
    return float(value)


def parse_scalar(value: str) -> Any:
'''
          assert marker in text
          text = text.replace(marker, helper, 1)
          text = text.replace(
              '''    for name, deviation in maximums.items():
        if deviation is not None and deviation > limits[name]:
            reasons.append(f"{name}={deviation} exceeds tolerance {limits[name]}")
''',
              '''    for name, maximum_deviation in maximums.items():
        if maximum_deviation is not None and maximum_deviation > limits[name]:
            reasons.append(f"{name}={maximum_deviation} exceeds tolerance {limits[name]}")
''',
              1,
          )
          text = text.replace(
              '        wall_values = [float((record.get("performance") or {}).get("wall_time_s")) for record in eligible]\n',
              '        wall_values = [performance_float(record, "wall_time_s") for record in eligible]\n',
              1,
          )
          text = text.replace('        equivalence = {\n', '        equivalence: dict[str, Any] = {\n', 1)
          text = text.replace('        summary = {\n', '        summary: dict[str, Any] = {\n', 1)
          replacements = {
              '[float((record.get("performance") or {}).get("cpu_time_s")) for record in eligible]': '[performance_float(record, "cpu_time_s") for record in eligible]',
              '[float((record.get("performance") or {}).get("scf_iterations")) for record in eligible]': '[performance_float(record, "scf_iterations") for record in eligible]',
              '[float((record.get("performance") or {}).get("peak_host_memory_mb")) for record in eligible]': '[performance_float(record, "peak_host_memory_mb") for record in eligible]',
              'float((record.get("performance") or {}).get("peak_device_memory_mb"))': 'performance_float(record, "peak_device_memory_mb")',
              '[float((record.get("performance") or {}).get("io_bytes")) for record in eligible]': '[performance_float(record, "io_bytes") for record in eligible]',
              'float((record.get("performance") or {}).get("energy_joules"))': 'performance_float(record, "energy_joules")',
          }
          for source, target in replacements.items():
              assert source in text
              text = text.replace(source, target)
          text = text.replace(
              '''        values = lines[1].split(delimiter)
        row = {key.strip(): value.strip() for key, value in zip(header, values, strict=False)}
''',
              '''        columns = lines[1].split(delimiter)
        row = {key.strip(): value.strip() for key, value in zip(header, columns, strict=False)}
''',
              1,
          )
          text = text.replace(
              '''        values: dict[str, str] = {}
        for line in text.splitlines():
            if ":" in line:
                key, value = line.split(":", 1)
                values[key.strip()] = value.strip()
        user = float(values.get("User time (seconds)", 0.0) or 0.0)
        system = float(values.get("System time (seconds)", 0.0) or 0.0)
''',
              '''        metrics: dict[str, str] = {}
        for line in text.splitlines():
            if ": " in line:
                key, value = line.rsplit(": ", 1)
                metrics[key.strip()] = value.strip()
        user = float(metrics.get("User time (seconds)", 0.0) or 0.0)
        system = float(metrics.get("System time (seconds)", 0.0) or 0.0)
''',
              1,
          )
          text = text.replace('"status": "AVAILABLE" if values else "NOT_AVAILABLE",', '"status": "AVAILABLE" if metrics else "NOT_AVAILABLE",', 1)
          text = text.replace('parse_duration(values.get("Elapsed (wall clock) time (h:mm:ss or m:ss)", ""))', 'parse_duration(metrics.get("Elapsed (wall clock) time (h:mm:ss or m:ss)", ""))', 1)
          text = text.replace('parse_memory_kib(values.get("Maximum resident set size (kbytes)", ""))', 'parse_memory_kib(metrics.get("Maximum resident set size (kbytes)", ""))', 1)
          text = text.replace('parse_scalar(values.get("File system inputs", "0"))', 'parse_scalar(metrics.get("File system inputs", "0"))', 1)
          text = text.replace('parse_scalar(values.get("File system outputs", "0"))', 'parse_scalar(metrics.get("File system outputs", "0"))', 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace('from pathlib import Path\n', 'from pathlib import Path\nfrom typing import Any\n', 1)
          tests = tests.replace(
              'class PerformanceEvidenceTests(unittest.TestCase):\n',
              'class PerformanceEvidenceTests(unittest.TestCase):\n    core: Any\n    policy: dict[str, Any]\n',
              1,
          )
          test_path.write_text(tests, encoding="utf-8")
          PY
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
          python -m ruff check \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
      - name: Commit typed sources only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
          git commit -m "fix: close real-evidence typing boundaries"
          git push origin HEAD:main

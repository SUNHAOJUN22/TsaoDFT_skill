<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc" aria-label="AI-assisted conceptual illustration; not computational data">
<title id="title">TsaoDFT evidence-first computational chemistry</title>
<desc id="desc">Editorial conceptual cover for an auditable DFT workflow spanning molecular, periodic and multiscale evidence; not computational or scientific data.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/>
    <stop offset="0.52" stop-color="#071b31"/>
    <stop offset="1" stop-color="#140a2a"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a5f3fc"/>
    <stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ede9fe"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fef3c7"/>
    <stop offset="1" stop-color="#f59e0b"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d1fae5"/>
    <stop offset="1" stop-color="#10b981"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.36"/>
    <stop offset="0.44" stop-color="#8b5cf6" stop-opacity="0.17"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#7dd3fc" stroke-opacity="0.03"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <style><![CDATA[
    .eyebrow{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2.3px;fill:#67e8f9}
    .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:70px;font-weight:760;letter-spacing:-2.4px;fill:#f8fafc}
    .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:21px;font-weight:420;fill:#c0d4e7}
    .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:450;fill:#8fa9c2}
    .stage{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:700;fill:#e8f1fa}
    .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:500;fill:#8aa5bd}
    .caption{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:10px;font-weight:650;letter-spacing:.8px;fill:#7593ad}
  ]]></style>
</defs>

<rect width="1400" height="520" rx="30" fill="url(#bg)"/>
<rect width="1400" height="520" rx="30" fill="url(#grid)"/>
<circle cx="900" cy="225" r="355" fill="url(#halo)"/>
<path d="M0 404C210 338 365 416 570 352S975 133 1400 252" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-opacity=".11"/>
<path d="M460 36C690 118 782 34 1035 80S1240 164 1400 135" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-opacity=".09"/>

<!-- identity -->
<text x="74" y="78" class="eyebrow">DFT-FIRST · AUDITABLE · EVIDENCE-LOCKED</text>
<text x="74" y="161" class="title">TsaoDFT</text>
<text x="74" y="208" class="subtitle">Computational chemistry with an explicit path from model to claim.</text>
<text x="74" y="249" class="body">Molecular DFT · periodic materials · provenance · ML · kinetics</text>

<!-- state rail -->
<g transform="translate(74 326)">
  <path d="M0 0H486" stroke="#274b66" stroke-width="2"/>
  <circle cx="0" cy="0" r="6" fill="url(#emerald)"/>
  <circle cx="162" cy="0" r="6" fill="url(#cyan)"/>
  <circle cx="324" cy="0" r="6" fill="url(#amber)"/>
  <circle cx="486" cy="0" r="6" fill="url(#violet)"/>
  <text x="0" y="31" class="stage">MODEL</text>
  <text x="162" y="31" text-anchor="middle" class="stage">COMPUTE</text>
  <text x="324" y="31" text-anchor="middle" class="stage">VALIDATE</text>
  <text x="486" y="31" text-anchor="end" class="stage">ACCEPT</text>
  <text x="0" y="52" class="small">charge · spin · mapping</text>
  <text x="486" y="52" text-anchor="end" class="small">bounded evidence · claim scope</text>
</g>

<!-- central electronic structure motif -->
<g transform="translate(770 246)" filter="url(#glow)">
  <ellipse rx="150" ry="58" fill="#8b5cf6" opacity=".25" transform="rotate(-22)"/>
  <ellipse rx="150" ry="58" fill="#22d3ee" opacity=".21" transform="rotate(22)"/>
  <ellipse rx="54" ry="165" fill="#f59e0b" opacity=".07" transform="rotate(90)"/>
  <line x1="-70" y1="0" x2="70" y2="0" stroke="#dbeafe" stroke-width="3"/>
  <circle cx="-84" cy="0" r="16" fill="url(#cyan)"/>
  <circle cx="84" cy="0" r="16" fill="url(#violet)"/>
  <circle r="13" fill="#f8fafc"/>
</g>
<text x="770" y="374" text-anchor="middle" class="eyebrow">ELECTRONIC-STRUCTURE EVIDENCE CORE</text>

<!-- right scientific evidence panel -->
<g transform="translate(1015 78)" filter="url(#shadow)">
  <rect width="310" height="354" rx="24" fill="#071a2e" fill-opacity=".92" stroke="#2b5678"/>
  <text x="28" y="42" class="stage">EVIDENCE WINDOW</text>
  <text x="28" y="65" class="small">one accepted claim, three independent checks</text>

  <!-- energy landscape -->
  <g transform="translate(28 102)">
    <path d="M0 70H254M0 0V70" stroke="#355d7a" stroke-width="1"/>
    <path d="M8 62C42 58 57 18 91 23s48 45 82 42 42-46 73-56" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="91" cy="23" r="5" fill="#fbbf24"/>
    <circle cx="246" cy="9" r="5" fill="#a78bfa"/>
    <text x="0" y="91" class="small">stationary points · modes · barriers</text>
  </g>

  <!-- periodic lattice -->
  <g transform="translate(30 222)" stroke="#67e8f9" stroke-width="1.4">
    <path d="M0 55l54-31 54 31-54 31z" fill="#0d2a45"/>
    <path d="M0 55V11l54-31 54 31v44M54-20V24" fill="none"/>
  </g>
  <g transform="translate(30 222)" fill="#34d399">
    <circle cx="0" cy="11" r="5"/><circle cx="54" cy="-20" r="5"/><circle cx="108" cy="11" r="5"/>
  </g>

  <!-- provenance chain -->
  <g transform="translate(164 220)">
    <circle cx="0" cy="18" r="7" fill="#34d399"/>
    <circle cx="42" cy="50" r="7" fill="#67e8f9"/>
    <circle cx="84" cy="18" r="7" fill="#a78bfa"/>
    <path d="M7 21L35 45M49 45L77 21" stroke="#6f91aa" stroke-width="2"/>
    <text x="42" y="82" text-anchor="middle" class="small">hash · lineage · scope</text>
  </g>
</g>

<rect y="492" width="1400" height="28" fill="#020617" fill-opacity=".92"/>
<text x="1380" y="511" text-anchor="end" class="caption">AI-ASSISTED CONCEPTUAL ILLUSTRATION · NOT COMPUTATIONAL DATA</text>
</svg>
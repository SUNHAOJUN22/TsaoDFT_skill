name: One-shot qualification measurement after domain coverage

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: tsao-domain-qualification-measurement
  cancel-in-progress: false

jobs:
  measure:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: measure qualification after domain coverage' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/complete-qualification \
            -f description="Qualification measurement after domain coverage running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Stage permanent CI for governance validation
        run: git checkout c2621b9891b2c3466767c6428583d6bbc0f17297 -- .github/workflows/ci.yml

      - name: Run complete quality gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_gate.py 2>&1 | tee complete-qualification.log

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Qualification measurement after domain coverage failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Qualification measurement after domain coverage passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/complete-qualification \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domain-qualification-${{ github.sha }}
          path: |
            complete-qualification.log
            coverage-report.json
          if-no-files-found: warn
          retention-days: 14

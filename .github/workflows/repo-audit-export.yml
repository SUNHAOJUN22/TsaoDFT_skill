name: Repository audit export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repo-audit-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Build chunked tracked-text snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-snapshot
          mkdir -p .audit-snapshot
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import pathlib
          import subprocess
          import tarfile

          root = pathlib.Path.cwd()
          source_head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")
          excluded_prefixes = (
              ".audit-snapshot/",
              "assets/ai/",
          )
          excluded_paths = {
              ".github/workflows/repo-audit-export.yml",
          }
          selected: list[str] = []
          skipped_binary: list[str] = []
          skipped_large: list[str] = []
          for relative in tracked:
              if not relative or relative in excluded_paths:
                  continue
              if relative.startswith(excluded_prefixes):
                  continue
              path = root / relative
              if not path.is_file():
                  continue
              size = path.stat().st_size
              if size > 2_000_000:
                  skipped_large.append(relative)
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  skipped_binary.append(relative)
                  continue
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError:
                  skipped_binary.append(relative)
                  continue
              selected.append(relative)

          archive_buffer = io.BytesIO()
          with tarfile.open(fileobj=archive_buffer, mode="w:gz", compresslevel=9) as archive:
              for relative in sorted(selected):
                  archive.add(root / relative, arcname=relative, recursive=False)
          payload = archive_buffer.getvalue()
          encoded = base64.b64encode(payload).decode("ascii")
          chunk_size = 600_000
          chunks = [encoded[index : index + chunk_size] for index in range(0, len(encoded), chunk_size)]
          out = root / ".audit-snapshot"
          chunk_records = []
          for index, chunk in enumerate(chunks):
              name = f"part-{index:03d}.txt"
              (out / name).write_text(chunk, encoding="ascii")
              chunk_records.append(
                  {
                      "name": name,
                      "characters": len(chunk),
                      "sha256": hashlib.sha256(chunk.encode("ascii")).hexdigest(),
                  }
              )
          manifest = {
              "format": "tracked-utf8-tar-gzip-base64-chunks-v1",
              "source_head": source_head,
              "selected_files": len(selected),
              "selected_paths": sorted(selected),
              "skipped_binary": sorted(skipped_binary),
              "skipped_large": sorted(skipped_large),
              "archive_bytes": len(payload),
              "archive_sha256": hashlib.sha256(payload).hexdigest(),
              "base64_characters": len(encoded),
              "chunks": chunk_records,
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit snapshot to main for connector retrieval
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit-snapshot
          git commit -m "chore: publish temporary source audit snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

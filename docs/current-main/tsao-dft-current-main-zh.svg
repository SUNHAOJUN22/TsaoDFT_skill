<path d="M327 357h21" fill="none" stroke="#c4b5fd" stroke-width="2" marker-end="url(#arrow)"/><path d="M634 357h21" fill="none" stroke="#c4b5fd" stroke-width="2" marker-end="url(#arrow)"/><path d="M941 357h21" fill="none" stroke="#c4b5fd" stroke-width="2" marker-end="url(#arrow)"/><path d="M1248 357h21" fill="none" stroke="#c4b5fd" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="46" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#c4b5fd" stroke-opacity=".5"/><circle cx="77" cy="279" r="15" fill="#c4b5fd" fill-opacity=".16"/><text x="77" y="284" text-anchor="middle" font-size="13" fill="#c4b5fd">01</text><text x="66" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="66,296.1,237,67.5"><tspan x="66" dy="0">科学问题</tspan></text><text x="66" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="66,376.9,237,58.5"><tspan x="66" dy="0">体系、可观测量与精度</tspan></text></g><g><rect x="353" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#c4b5fd" stroke-opacity=".5"/><circle cx="384" cy="279" r="15" fill="#c4b5fd" fill-opacity=".16"/><text x="384" y="284" text-anchor="middle" font-size="13" fill="#c4b5fd">02</text><text x="373" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="373,296.1,237,67.5"><tspan x="373" dy="0">结构与周期性</tspan></text><text x="373" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="373,376.9,237,58.5"><tspan x="373" dy="0">晶胞、PBC 与邻居表</tspan></text></g><g><rect x="660" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#c4b5fd" stroke-opacity=".5"/><circle cx="691" cy="279" r="15" fill="#c4b5fd" fill-opacity=".16"/><text x="691" y="284" text-anchor="middle" font-size="13" fill="#c4b5fd">03</text><text x="680" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="680,296.1,237,67.5"><tspan x="680" dy="0">方法合同</tspan></text><text x="680" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="680,376.9,237,58.5"><tspan x="680" dy="0">泛函、基组/截断与 SCF</tspan></text></g><g><rect x="967" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#c4b5fd" stroke-opacity=".5"/><circle cx="998" cy="279" r="15" fill="#c4b5fd" fill-opacity=".16"/><text x="998" y="284" text-anchor="middle" font-size="13" fill="#c4b5fd">04</text><text x="987" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="987,296.1,237,67.5"><tspan x="987" dy="0">数值验收</tspan></text><text x="987" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="987,376.9,237,58.5"><tspan x="987" dy="0">能量、力、应力与等价</tspan></text></g><g><rect x="1274" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#c4b5fd" stroke-opacity=".5"/><circle cx="1305" cy="279" r="15" fill="#c4b5fd" fill-opacity=".16"/><text x="1305" y="284" text-anchor="middle" font-size="13" fill="#c4b5fd">05</text><text x="1294" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="1294,296.1,237,67.5"><tspan x="1294" dy="0">证据分级</tspan></text><text x="1294" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="1294,376.9,237,58.5"><tspan x="1294" dy="0">L0–L3、哈希与责任边界</tspan></text></g><g><rect x="46" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="68" y="544" font-size="17" font-weight="650" fill="#c4b5fd" data-box="68,521.9,432,30.5"><tspan x="68" dy="0">01  Kohn–Sham 方法合同</tspan></text><text x="68" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="68,563.3,432,35.5"><tspan x="68" dy="0">[−½∇² + v_eff[n]] ψ_i = ε_i ψ_i</tspan></text></g><g><rect x="552" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="574" y="544" font-size="17" font-weight="650" fill="#c4b5fd" data-box="574,521.9,432,30.5"><tspan x="574" dy="0">02  行晶格的最近像</tspan></text><text x="574" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="574,563.3,432,35.5"><tspan x="574" dy="0">n* = argmin_n ‖Δr − nH‖₂</tspan></text><text x="574" y="617" font-size="19" font-weight="400" fill="#f8fafc" data-box="574,592.3,432,35.5"><tspan x="574" dy="0">Δr_MIC = Δr − n*H</tspan></text></g><g><rect x="1058" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="1080" y="544" font-size="17" font-weight="650" fill="#c4b5fd" data-box="1080,521.9,432,30.5"><tspan x="1080" dy="0">03  参考等价与资格分级</tspan></text><text x="1080" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="1080,563.3,432,35.5"><tspan x="1080" dy="0">|E − E_ref| ≤ τ_E</tspan></text><text x="1080" y="617" font-size="19" font-weight="400" fill="#f8fafc" data-box="1080,592.3,432,35.5"><tspan x="1080" dy="0">max_i ‖F_i − F_i,ref‖₂ ≤ τ_F</tspan></text></g>
<rect x="46" y="712" width="1488" height="111" rx="18" fill="#080f1b" stroke="#334155"/>
<text x="73" y="741" font-size="13" font-weight="650" fill="#c4b5fd" data-box="73,724.1,1440,26.5"><tspan x="73" dy="0">资格与解释边界</tspan></text><text x="73" y="767" font-size="18" font-weight="400" fill="#dbeafe" data-box="73,743.6,1440,63"><tspan x="73" dy="0">软件门禁只验证控制面、参考数值与证据合同；Gaussian、VASP、QE、CP2K 等外部引擎未在此自动执行，保持 EXTERNAL_HOLD。</tspan></text>

name: One-shot real-evidence formatter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-real-evidence-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install locked Ruff
        run: python -m pip install "ruff==0.15.22"
      - name: Apply exact formatting
        run: |
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/scripts/validate_benchmark_result.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
          python -m ruff check \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/scripts/validate_benchmark_result.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
          python -m ruff format --check \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/scripts/validate_benchmark_result.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
      - name: Commit only formatted sources
        shell: bash
        run: |
          if git diff --quiet -- \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/scripts/validate_benchmark_result.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py; then
            echo "Files already match Ruff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/scripts/validate_benchmark_result.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
          git commit -m "style: apply exact real-evidence Ruff format"
          git push origin HEAD:main

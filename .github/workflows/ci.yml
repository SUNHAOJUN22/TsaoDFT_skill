name: One-shot permanent typing repair

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-permanent-typing-repair
  cancel-in-progress: false

jobs:
  repair:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: repair trust typing' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/typing-repair \
            -f description="Trust typing repair and full gate running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install reviewed environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Apply reviewed typing and Ruff repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'reviewed target not found: {path_text}: {old[:60]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          inventory = Path('skills/tsao-dft-hpc-provenance/scripts/inspect_execution_environment.py')
          text = inventory.read_text(encoding='utf-8')
          start = text.index('    if errors:\n', text.index('def main() -> int:'))
          end = text.index('    rendered = (\n', start)
          block = text[start:end]
          if '"inventory": report' not in block or '    else:\n' not in block:
              raise SystemExit('reviewed SIM108 block failed structural validation')
          replacement = '''    report = (
              {"ok": False, "errors": errors, "inventory": report}
              if errors
              else {"ok": True, "inventory": report}
          )
          '''
          inventory.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          replace_once(
              'skills/tsao-dft-hpc-provenance/scripts/engine_parser_contract.py',
              '        vector = []\n',
              '        vector: list[float] = []\n',
          )
          replace_once(
              'skills/tsao-dft-hpc-provenance/scripts/shell_contract.py',
              '''    try:
              signature = base64.b64decode(attestation.get("signature"), validate=True)
              key = serialization.load_pem_public_key(public_key_pem)
              if not isinstance(key, Ed25519PublicKey):
                  raise ValueError("review key must be Ed25519")
              key.verify(signature, canonical_json(unsigned).encode("utf-8"))
          ''',
              '''    try:
              signature_value = attestation.get("signature")
              if not isinstance(signature_value, str):
                  raise ValueError("attestation signature must be base64 text")
              signature = base64.b64decode(signature_value, validate=True)
              public_key = serialization.load_pem_public_key(public_key_pem)
              if not isinstance(public_key, Ed25519PublicKey):
                  raise ValueError("review key must be Ed25519")
              public_key.verify(signature, canonical_json(unsigned).encode("utf-8"))
          ''',
          )
          replace_once(
              'skills/tsao-dft-hpc-provenance/scripts/validate_hpc_manifest.py',
              '''    if not isinstance(loaded, dict):
              errors, warnings = ["manifest root must be a mapping"], []
          else:
          ''',
              '''    if not isinstance(loaded, dict):
              errors: list[str] = ["manifest root must be a mapping"]
              warnings: list[str] = []
          else:
          ''',
          )
          replace_once(
              'skills/tsao-dft-hpc-provenance/tests/test_engine_parser_contract.py',
              'class EngineParserContractTests(unittest.TestCase):\n',
              'class EngineParserContractTests(unittest.TestCase):\n    core: Any\n    schema: dict[str, Any]\n\n',
          )
          replace_once(
              'skills/tsao-dft-hpc-provenance/tests/test_benchmark_bridge.py',
              'class BenchmarkBridgeTests(unittest.TestCase):\n',
              'class BenchmarkBridgeTests(unittest.TestCase):\n    bridge: Any\n    parser: Any\n\n',
          )
          replace_once(
              'skills/tsao-dft-hpc-provenance/tests/test_shell_trust_boundary.py',
              'class ShellTrustBoundaryTests(unittest.TestCase):\n',
              'class ShellTrustBoundaryTests(unittest.TestCase):\n    validator: Any\n    generator: Any\n    base: dict[str, Any]\n\n',
          )
          replace_once(
              'skills/tsao-dft-hpc-provenance/tests/test_evidence_trust_boundary.py',
              'class EvidenceTrustBoundaryTests(unittest.TestCase):\n',
              '''class EvidenceTrustBoundaryTests(unittest.TestCase):
              trust: Any
              shell: Any
              performance: Any
              result_schema: dict[str, Any]
              policy_schema: dict[str, Any]
              policy: dict[str, Any]

          ''',
          )
          PY
          python -m ruff check --fix .
          python -m ruff format .
          git checkout e94340da02ca62d43b410235a5628cb696dd2e24 -- .github/workflows/ci.yml
          rm -f .github/workflows/ruff-repair-once.yml .github/ruff-repair.trigger

      - name: Run complete quality gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_gate.py 2>&1 | tee permanent-typing-repair-quality.log

      - name: Commit and push net repair
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close trust typing and formatting gates"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            python scripts/quality_gate.py 2>&1 | tee "permanent-typing-repair-rebased-${attempt}.log"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Trust typing repair or full gate failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Trust typing repair and full gate passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/typing-repair \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permanent-typing-repair-${{ github.sha }}
          path: permanent-typing-repair-*.log
          if-no-files-found: warn
          retention-days: 14

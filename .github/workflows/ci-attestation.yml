name: CI Attestation

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: tsao-dft-ci-attestation
  cancel-in-progress: false

jobs:
  attest:
    if: contains(github.event.issue.title, '[TsaoDFT CI Verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run repository validation
        run: |
          python scripts/generate_readme_demos.py
          git diff --exit-code -- assets/demo
          python scripts/validate_catalog.py
          python scripts/validate_ai_assets.py
          python scripts/validate_readme_visuals.py --strict
          python scripts/validate_repo.py --strict
          python scripts/run_all_tests.py
      - name: Record successful hosted attestation
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > docs/CI_VERIFIED.md <<EOF
          # GitHub-hosted CI attestation

          - status: **PASS**
          - source commit: \`${source_sha}\`
          - verified at: \`${verified_at}\`
          - runner: \`ubuntu-latest\`
          - Python: \`3.12\`
          - trigger: issue #${{ github.event.issue.number }}

          The GitHub-hosted runner completed demo reproducibility checks, catalog validation, AI-asset governance, README visual validation, strict repository validation, and all unit-test suites before writing this attestation.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CI_VERIFIED.md
          if git diff --cached --quiet; then
            echo 'Attestation already current.'
          else
            git commit -m 'ci: record successful GitHub-hosted validation'
            git push origin HEAD:main
          fi

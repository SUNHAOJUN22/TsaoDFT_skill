name: Apply audited TsaoDFT security remediation

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  apply-security-remediation:
    if: contains(github.event.head_commit.message, '[apply-security]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install audit toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Capture exact remediation
        id: remediation
        shell: bash
        run: |
          set +e
          {
            python .github/apply-security-remediation-once.py
            python -m ruff format scripts tests skills
            python -m ruff check scripts tests skills
          } 2>&1 | tee remediation.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-remediation-${{ github.sha }}
          path: remediation.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish remediation status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.remediation.outputs.exit_code }}
        run: |
          state=failure
          description='Security remediation failed; inspect artifact'
          if [ "$RESULT" = '0' ]; then
            state=success
            description='Security remediation applied and formatted'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='tsao-dft/security-remediation' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Commit deterministic remediation
        if: steps.remediation.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts tests skills requirements.txt requirements-dev.txt pyproject.toml
          git commit -m 'security: apply audited installer, XML, typing and Skill trust boundaries [skip ci]'
          git push origin HEAD:main

      - name: Fail when remediation failed
        if: steps.remediation.outputs.exit_code != '0'
        run: exit 1

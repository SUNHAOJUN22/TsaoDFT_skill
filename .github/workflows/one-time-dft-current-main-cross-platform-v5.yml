name: DFT current-main cross-platform qualification v5

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  packages: read
  security-events: write

concurrency:
  group: dft-current-main-cross-platform-v5
  cancel-in-progress: false

jobs:
  prepare-clean-target:
    if: >-
      github.event.issue.number == 13 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/run-dft-current-main-cross-platform-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tested_sha: ${{ steps.publish.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Publish controller-free exact target
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$parent"
          git rm .github/workflows/one-time-dft-current-main-cross-platform-v5.yml
          python - <<'PY'
          from pathlib import Path
          root = Path('.github/workflows')
          observed = {p.name for p in root.glob('*.yml')} | {p.name for p in root.glob('*.yaml')}
          if observed != {'ci.yml'}:
              raise SystemExit(f'workflow inventory mismatch: {sorted(observed)}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): publish clean DFT current-main qualification target'
          tested_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$parent"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$tested_sha"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
      - name: Record exact target
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.publish.outputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 13 --repo "$GITHUB_REPOSITORY" --body "DFT_CURRENT_MAIN_CROSS_PLATFORM_V5 RUNNING run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID tested_sha=$TESTED_SHA controller=already_removed external_engines=EXTERNAL_HOLD"

  linux-quality:
    needs: prepare-clean-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            constraint: constraints/py310.txt
          - python-version: '3.12'
            constraint: constraints/py312.txt
          - python-version: '3.13'
            constraint: constraints/py313.txt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare-clean-target.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ${{ matrix.constraint }}
      - name: Install and verify locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c "${{ matrix.constraint }}" -r requirements-dev.txt
          python -m pip check
      - name: Run complete quality gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.prepare-clean-target.outputs.tested_sha }}'
          python scripts/quality_gate.py 2>&1 | tee quality-gate.log
          git diff --exit-code
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dft-v5-quality-python-${{ matrix.python-version }}-${{ needs.prepare-clean-target.outputs.tested_sha }}
          path: |
            quality-gate.log
            coverage-report.json
          if-no-files-found: error
          retention-days: 30

  windows-control-plane:
    needs: prepare-clean-target
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare-clean-target.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt
      - name: Install and verify locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture privacy-bounded Windows inventory
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ needs.prepare-clean-target.outputs.tested_sha }}') { throw 'tested SHA mismatch' }
          $pwsh = (Get-Command -Name 'pwsh' -CommandType Application -ErrorAction Stop).Source
          & $pwsh -NoProfile -File '.\skills\tsao-dft-hpc-provenance\scripts\inspect_windows_environment.ps1' -Out 'windows-environment.json'
          if ($LASTEXITCODE -ne 0) { throw 'Windows environment inventory failed' }
          $report = Get-Content -LiteralPath 'windows-environment.json' -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Windows environment inventory is not valid' }
          if ($report.external_dft_engine_invoked -ne $false) { throw 'external DFT engine was invoked' }
          if ($report.performance_qualification -ne 'NOT_ELIGIBLE') { throw 'inventory misclassified as performance evidence' }
          foreach ($field in @('hostname_recorded','username_recorded','home_path_recorded','environment_values_recorded','executable_paths_recorded')) {
            if ($report.privacy.$field -ne $false) { throw "privacy contract failed for $field" }
          }
      - name: Run complete PowerShell quality gate
        shell: pwsh
        run: |
          $pwsh = (Get-Command -Name 'pwsh' -CommandType Application -ErrorAction Stop).Source
          & $pwsh -NoProfile -File '.\scripts\quality_gate.ps1' *>&1 | Tee-Object -FilePath 'windows-quality-gate.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dft-v5-windows-${{ needs.prepare-clean-target.outputs.tested_sha }}
          path: |
            windows-environment.json
            windows-quality-gate.log
            coverage-report.json
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    needs: prepare-clean-target
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare-clean-target.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt
      - name: Install audited locked dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check
      - name: Audit runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.prepare-clean-target.outputs.tested_sha }}'
          python -m pip_audit -r requirements.txt --format json --output pip-audit-runtime.json
          test -s pip-audit-runtime.json
      - name: Audit development dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit -r requirements-dev.txt --format json --output pip-audit-development.json
          test -s pip-audit-development.json
      - name: Audit locked constraints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit --no-deps -r constraints/py312.txt --format json --output pip-audit-locked.json
          test -s pip-audit-locked.json
      - name: Generate CycloneDX SBOM
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit --no-deps -r constraints/py312.txt --format cyclonedx-json --output sbom.cdx.json
          test -s sbom.cdx.json
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dft-v5-supply-chain-${{ needs.prepare-clean-target.outputs.tested_sha }}
          path: |
            pip-audit-runtime.json
            pip-audit-development.json
            pip-audit-locked.json
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    needs: prepare-clean-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare-clean-target.outputs.tested_sha }}
          persist-credentials: false
      - name: Verify exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = '${{ needs.prepare-clean-target.outputs.tested_sha }}'
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          category: '/language:python-current-main-v5'

  record:
    needs: [prepare-clean-target, linux-quality, windows-control-plane, supply-chain, codeql]
    if: >-
      always() &&
      github.event.issue.number == 13 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/run-dft-current-main-cross-platform-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record exact permanent-gate outcome
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE: ${{ needs.prepare-clean-target.result }}
          LINUX: ${{ needs.linux-quality.result }}
          WINDOWS: ${{ needs.windows-control-plane.result }}
          SUPPLY: ${{ needs.supply-chain.result }}
          CODEQL: ${{ needs.codeql.result }}
          TESTED_SHA: ${{ needs.prepare-clean-target.outputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/main | cut -f1)"
          verdict=FAIL
          if [[ -n "${TESTED_SHA:-}" && "$remote_sha" != "$TESTED_SHA" ]]; then
            verdict=STALE_MAIN
          elif [[ "$PREPARE" == success && "$LINUX" == success && "$WINDOWS" == success && "$SUPPLY" == success && "$CODEQL" == success ]]; then
            verdict=PASS
          fi
          gh issue comment 13 --repo "$GITHUB_REPOSITORY" --body "DFT_CURRENT_MAIN_CROSS_PLATFORM_V5 verdict=$verdict run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID tested_sha=${TESTED_SHA:-UNRESOLVED} remote_main=$remote_sha prepare=$PREPARE linux=$LINUX windows=$WINDOWS supply_chain=$SUPPLY codeql=$CODEQL controller=removed_before_testing external_engines=EXTERNAL_HOLD"
          test "$verdict" = PASS

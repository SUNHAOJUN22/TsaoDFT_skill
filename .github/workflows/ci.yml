name: One-shot split acceleration edge coverage validation

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-split-acceleration-edge-coverage
  cancel-in-progress: false

jobs:
  validate:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: validate split acceleration edge coverage' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/acceleration-edge-coverage \
            -f description="Split acceleration edge coverage validation running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Materialize split edge tests
        env:
          PERFORMANCE_PAYLOAD: ""
          PLANNER_PAYLOAD: ""
          AUTOTUNING_PAYLOAD: ""
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          payloads = {
              "test_release_performance_evidence_edges.py": os.environ["PERFORMANCE_PAYLOAD"],
              "test_release_acceleration_planner_edges.py": os.environ["PLANNER_PAYLOAD"],
              "test_release_autotuning_edges.py": os.environ["AUTOTUNING_PAYLOAD"],
          }
          root = Path("skills/tsao-dft-hpc-provenance/tests")
          for name, payload in payloads.items():
              target = root / name
              target.write_bytes(gzip.decompress(base64.b64decode(payload)))
              if target.stat().st_size < 9000:
                  raise SystemExit(f"payload too small: {name}")
          PY

      - name: Validate split edge tests
        run: |
          targets=(
            skills/tsao-dft-hpc-provenance/tests/test_release_performance_evidence_edges.py
            skills/tsao-dft-hpc-provenance/tests/test_release_acceleration_planner_edges.py
            skills/tsao-dft-hpc-provenance/tests/test_release_autotuning_edges.py
          )
          python -m ruff check --fix "${targets[@]}"
          python -m ruff format "${targets[@]}"
          python -m ruff check "${targets[@]}"
          python -m ruff format --check "${targets[@]}"
          python -m mypy "${targets[@]}"
          python -m unittest discover -s skills/tsao-dft-hpc-provenance/tests -p 'test_release_performance_evidence_edges.py' -v
          python -m unittest discover -s skills/tsao-dft-hpc-provenance/tests -p 'test_release_acceleration_planner_edges.py' -v
          python -m unittest discover -s skills/tsao-dft-hpc-provenance/tests -p 'test_release_autotuning_edges.py' -v

      - name: Stage permanent CI and run repository contracts
        run: |
          git checkout 5771543d01ad30d2509d520cf1f6c6fdb671c7a6 -- .github/workflows/ci.yml
          python scripts/validate_ignore_markers.py
          python scripts/validate_repo.py --strict --json
          python scripts/install.py --dry-run

      - name: Commit and push test files only
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/ci.yml
          git add skills/tsao-dft-hpc-provenance/tests/test_release_performance_evidence_edges.py
          git add skills/tsao-dft-hpc-provenance/tests/test_release_acceleration_planner_edges.py
          git add skills/tsao-dft-hpc-provenance/tests/test_release_autotuning_edges.py
          git commit -m "test: close acceleration evidence planner and autotuning branches"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Split acceleration edge coverage validation failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Split acceleration edge coverage tests passed and were pushed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/acceleration-edge-coverage \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

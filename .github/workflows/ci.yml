name: TsaoDFT exact real-evidence format export

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsao-dft-format-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-export:
    name: Exact real-evidence formatter
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install locked Ruff
        run: python -m pip install "ruff==0.15.22"
      - name: Format and verify
        run: |
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/scripts/validate_benchmark_result.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
          python -m ruff check \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/scripts/validate_benchmark_result.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
          python -m ruff format --check \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/scripts/validate_benchmark_result.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
      - name: Stage exact formatted files
        run: |
          mkdir -p formatted/scripts formatted/tests
          cp skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py formatted/scripts/
          cp skills/tsao-dft-hpc-provenance/scripts/validate_benchmark_result.py formatted/scripts/
          cp skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py formatted/tests/
      - name: Upload exact formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruff-formatted-real-evidence
          path: formatted
          if-no-files-found: error
          retention-days: 3
      - name: Publish export status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="tsao-dft/real-evidence-format-export" \
            -f description="Exact Ruff-formatted real-evidence files exported" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

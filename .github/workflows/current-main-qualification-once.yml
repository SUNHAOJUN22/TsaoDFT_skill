name: Current main qualification once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/current-main-qualification-once.yml

permissions:
  contents: write
  issues: write
  packages: read
  security-events: write

concurrency:
  group: dft-current-main-qualification-once
  cancel-in-progress: false

jobs:
  linux_quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: '3.10'
            constraint: constraints/py310.txt
          - python_version: '3.12'
            constraint: constraints/py312.txt
          - python_version: '3.13'
            constraint: constraints/py313.txt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ${{ matrix.constraint }}
      - name: Remove one-time controller from qualified tree
        run: git rm .github/workflows/current-main-qualification-once.yml
      - name: Install and run complete quality gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c '${{ matrix.constraint }}' -r requirements-dev.txt
          python -m pip check
          python scripts/quality_gate.py
          git diff --exit-code
          git diff --check --cached
          test "$(git diff --cached --name-only)" = '.github/workflows/current-main-qualification-once.yml'

  windows_control_plane:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt
      - name: Remove one-time controller from qualified tree
        shell: pwsh
        run: |
          git rm .github/workflows/current-main-qualification-once.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run permanent Windows control-plane contract
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pwsh = (Get-Command -Name 'pwsh' -CommandType Application -ErrorAction Stop).Source
          & $pwsh -NoProfile -File '.\skills\tsao-dft-hpc-provenance\scripts\inspect_windows_environment.ps1' -Out "$env:RUNNER_TEMP/windows-environment.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -LiteralPath "$env:RUNNER_TEMP/windows-environment.json" -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Windows inventory is not valid' }
          if ($report.external_dft_engine_invoked -ne $false) { throw 'External DFT engine was invoked' }
          if ($report.performance_qualification -ne 'NOT_ELIGIBLE') { throw 'Inventory misclassified as performance evidence' }
          & $pwsh -NoProfile -File '.\scripts\quality_gate.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check --cached
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $staged = (git diff --cached --name-only).Trim()
          if ($staged -ne '.github/workflows/current-main-qualification-once.yml') { throw "unexpected staged path: $staged" }

  supply_chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt
      - name: Remove one-time controller from qualified tree
        run: git rm .github/workflows/current-main-qualification-once.yml
      - name: Run exact dependency audits and SBOM
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check
          python -m pip_audit -r requirements.txt --format json --output "$RUNNER_TEMP/pip-audit-runtime.json"
          python -m pip_audit -r requirements-dev.txt --format json --output "$RUNNER_TEMP/pip-audit-development.json"
          python -m pip_audit --no-deps -r constraints/py312.txt --format json --output "$RUNNER_TEMP/pip-audit-locked.json"
          python -m pip_audit --no-deps -r constraints/py312.txt --format cyclonedx-json --output "$RUNNER_TEMP/sbom.cdx.json"
          test -s "$RUNNER_TEMP/pip-audit-runtime.json"
          test -s "$RUNNER_TEMP/pip-audit-development.json"
          test -s "$RUNNER_TEMP/pip-audit-locked.json"
          test -s "$RUNNER_TEMP/sbom.cdx.json"
          git diff --exit-code
          git diff --check --cached
          test "$(git diff --cached --name-only)" = '.github/workflows/current-main-qualification-once.yml'

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Remove one-time controller from qualified tree
        run: git rm .github/workflows/current-main-qualification-once.yml
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          category: '/language:python-current-main-qualification'

  publish:
    needs: [linux_quality, windows_control_plane, supply_chain, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact qualified clean tree
        shell: bash
        run: |
          set -euo pipefail
          parent="$GITHUB_SHA"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$parent"
          git rm .github/workflows/current-main-qualification-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): remove completed current-main qualifier'
          test "$(git rev-parse HEAD^)" = "$parent"
          git push origin HEAD:main

  record:
    needs: [linux_quality, windows_control_plane, supply_chain, codeql, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record exact permanent-gate outcome
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX: ${{ needs.linux_quality.result }}
          WINDOWS: ${{ needs.windows_control_plane.result }}
          SUPPLY: ${{ needs.supply_chain.result }}
          CODEQL: ${{ needs.codeql.result }}
          PUBLISH: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -euo pipefail
          outcome=failure
          if [[ "$LINUX" == success && "$WINDOWS" == success && "$SUPPLY" == success && "$CODEQL" == success && "$PUBLISH" == success ]]; then outcome=success; fi
          gh issue comment 13 --body "CURRENT_MAIN_EXACT_QUALIFICATION outcome=${outcome} tested_parent=${GITHUB_SHA} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} linux=${LINUX} windows=${WINDOWS} supply_chain=${SUPPLY} codeql=${CODEQL} publish=${PUBLISH} controller=self-removed-on-success external_engines=EXTERNAL_HOLD"
          test "$outcome" = success

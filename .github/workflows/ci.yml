name: TsaoDFT encoded real-evidence typing closure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install locked Ruff
        run: python -m pip install "ruff==0.15.22"
      - name: Apply encoded patch
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/apply_typing_patch.py
          python /tmp/apply_typing_patch.py
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
          python -m ruff check \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
      - name: Commit typed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/tsao-dft-hpc-provenance/scripts/performance_evidence.py \
            skills/tsao-dft-hpc-provenance/tests/test_performance_evidence.py
          git commit -m "fix: close real-evidence typing boundaries"
          git push origin HEAD:main

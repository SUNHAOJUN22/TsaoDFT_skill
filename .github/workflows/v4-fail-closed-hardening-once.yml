name: V4 fail-closed hardening once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: v4-fail-closed-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/v4-fail-closed-hardening-v4')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install constrained validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check
      - name: Build direct-failure CI and aligned governance tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow_path = Path('.github/workflows/ci.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(
                  pattern,
                  lambda _match: replacement,
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return updated

          workflow = replace_once(
              workflow,
              r"      - name: Capture complete quality gate\n.*?(?=      - name: Upload failure log)",
              """      - name: Run complete quality gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality_gate.py 2>&1 | tee quality-gate.log

""",
              'Linux quality capture',
          )
          workflow = workflow.replace(
              "        if: always() && steps.gate.outputs.exit_code != '0'\n",
              "        if: failure()\n",
              1,
          )
          workflow = replace_once(
              workflow,
              r"\n      - name: Publish best-effort compatibility summary\n.*?\n      - name: Fail job when quality gate fails\n.*?(?=\n  windows-control-plane:)",
              "",
              'Linux delayed status and failure blocks',
          )
          workflow = replace_once(
              workflow,
              r"      - name: Capture complete PowerShell quality gate\n.*?(?=      - name: Upload Windows control-plane evidence)",
              """      - name: Run complete PowerShell quality gate
        shell: pwsh
        run: |
          $pwsh = (Get-Command -Name "pwsh" -CommandType Application -ErrorAction Stop).Source
          & $pwsh -NoProfile -File ".\\scripts\\quality_gate.ps1" *>&1 |
            Tee-Object -FilePath "windows-quality-gate.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

""",
              'Windows quality capture',
          )
          workflow = replace_once(
              workflow,
              r"\n      - name: Publish best-effort Windows compatibility summary\n.*?\n      - name: Fail job when PowerShell quality gate fails\n.*?(?=\n  supply-chain:)",
              "",
              'Windows delayed status and failure blocks',
          )
          workflow = replace_once(
              workflow,
              r"      - name: Capture all dependency audits and SBOM\n.*?(?=      - name: Upload supply-chain evidence)",
              """      - name: Audit runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit -r requirements.txt --format json --output pip-audit-runtime.json
          test -s pip-audit-runtime.json

      - name: Audit development dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit -r requirements-dev.txt --format json --output pip-audit-development.json
          test -s pip-audit-development.json

      - name: Audit locked constraints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit --no-deps -r constraints/py312.txt --format json --output pip-audit-locked.json
          test -s pip-audit-locked.json

      - name: Generate CycloneDX SBOM
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit --no-deps -r constraints/py312.txt --format cyclonedx-json --output sbom.cdx.json
          test -s sbom.cdx.json

""",
              'supply-chain capture block',
          )
          workflow = replace_once(
              workflow,
              r"\n      - name: Fail job when an audit or SBOM command fails\n.*?(?=\n  codeql:)",
              "",
              'delayed supply-chain failure block',
          )
          for forbidden in (
              'continue-on-error:',
              'set +e',
              'steps.gate.outputs',
              'steps.windows-gate.outputs',
              'steps.audit.outputs',
              'best-effort compatibility summary',
              'Fail job when',
          ):
              if forbidden in workflow:
                  raise SystemExit(f'forbidden delayed-failure construct remains: {forbidden}')
          workflow_path.write_text(workflow, encoding='utf-8', newline='\n')

          tests_path = Path('tests/test_permanent_ci_contract.py')
          tests = tests_path.read_text(encoding='utf-8')
          windows_method = '''    def test_windows_control_plane_is_real_private_and_evidence_preserving(self) -> None:
        path = ROOT / ".github" / "workflows" / "ci.yml"
        data = yaml.safe_load(path.read_text(encoding="utf-8"))
        job = data["jobs"]["windows-control-plane"]
        self.assertEqual(job["runs-on"], "windows-latest")
        self.assertEqual(job["permissions"], {"contents": "read", "statuses": "write"})
        steps = job["steps"]
        by_name = {step["name"]: step for step in steps}

        setup = by_name["Setup Python 3.12"]
        self.assertEqual(setup["with"]["python-version"], "3.12")
        self.assertIn("constraints/py312.txt", setup["with"]["cache-dependency-path"])

        inventory = by_name["Capture privacy-bounded Windows inventory"]
        self.assertEqual(inventory["shell"], "pwsh")
        for fragment in (
            "inspect_windows_environment.ps1",
            "windows-environment.json",
            "external_dft_engine_invoked",
            "NOT_ELIGIBLE",
            "hostname_recorded",
            "username_recorded",
            "home_path_recorded",
            "environment_values_recorded",
            "executable_paths_recorded",
        ):
            self.assertIn(fragment, inventory["run"])

        gate = by_name["Run complete PowerShell quality gate"]
        self.assertNotIn("id", gate)
        self.assertEqual(gate["shell"], "pwsh")
        for fragment in (
            "quality_gate.ps1",
            "windows-quality-gate.log",
            "Tee-Object",
            "$LASTEXITCODE",
            "exit $LASTEXITCODE",
        ):
            self.assertIn(fragment, gate["run"])
        self.assertNotIn("GITHUB_OUTPUT", gate["run"])

        upload = by_name["Upload Windows control-plane evidence"]
        self.assertEqual(upload["if"], "always()")
        self.assertEqual(upload["with"]["if-no-files-found"], "error")
        for report in (
            "windows-environment.json",
            "windows-quality-gate.log",
            "coverage-report.json",
        ):
            self.assertIn(report, upload["with"]["path"])

        self.assertNotIn("Publish best-effort Windows compatibility summary", by_name)
        self.assertNotIn("Fail job when PowerShell quality gate fails", by_name)

'''
          tests = replace_once(
              tests,
              r"    def test_windows_control_plane_is_real_private_and_evidence_preserving\(self\) -> None:\n.*?(?=    def test_supply_chain_reports_are_always_preserved_before_failure)",
              windows_method,
              'Windows governance test',
          )
          supply_method = '''    def test_supply_chain_reports_are_always_preserved_before_failure(self) -> None:
        path = ROOT / ".github" / "workflows" / "ci.yml"
        data = yaml.safe_load(path.read_text(encoding="utf-8"))
        steps = data["jobs"]["supply-chain"]["steps"]
        by_name = {step["name"]: step for step in steps}

        direct_steps = (
            ("Audit runtime dependencies", "pip-audit-runtime.json"),
            ("Audit development dependencies", "pip-audit-development.json"),
            ("Audit locked constraints", "pip-audit-locked.json"),
            ("Generate CycloneDX SBOM", "sbom.cdx.json"),
        )
        for index, (name, report) in enumerate(direct_steps):
            step = by_name[name]
            if index:
                self.assertEqual(step["if"], "always()")
            self.assertEqual(step["shell"], "bash")
            self.assertIn("set -euo pipefail", step["run"])
            self.assertIn(report, step["run"])
            self.assertNotIn("set +e", step["run"])
            self.assertNotIn("GITHUB_OUTPUT", step["run"])

        upload = by_name["Upload supply-chain evidence"]
        self.assertEqual(upload["if"], "always()")
        self.assertEqual(upload["with"]["if-no-files-found"], "error")
        for _, report in direct_steps:
            self.assertIn(report, upload["with"]["path"])

        self.assertNotIn("Capture all dependency audits and SBOM", by_name)
        self.assertNotIn("Fail job when an audit or SBOM command fails", by_name)
'''
          tests = replace_once(
              tests,
              r"    def test_supply_chain_reports_are_always_preserved_before_failure\(self\) -> None:\n.*?(?=\n\nif __name__)",
              supply_method,
              'supply-chain governance test',
          )
          tests_path.write_text(tests, encoding='utf-8', newline='\n')

          for controller in (
              Path('.github/workflows/v4-fail-closed-hardening-once.yml'),
              Path('.github/workflows/v4-strict-hardening-once.yml'),
          ):
              controller.unlink(missing_ok=False)
          PY
          git diff --check
      - name: Create exact controller-free candidate
        id: candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: make DFT evidence gates directly fail closed'
          echo 'sha='"$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Qualify exact DFT candidate
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python -m pytest -q tests/test_permanent_ci_contract.py
          python scripts/quality_gate.py
          python -m pytest -q
          python scripts/build_release_acceptance.py --help >/dev/null
          python scripts/capture_compute_contract_evidence.py --help >/dev/null
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          forbidden = (
              'continue-on-error:',
              'set +e',
              'steps.gate.outputs',
              'steps.windows-gate.outputs',
              'steps.audit.outputs',
              '|| true',
          )
          found = [token for token in forbidden if token in workflow]
          if found:
              raise SystemExit(f'forbidden fail-open constructs remain: {found}')
          workflows = sorted(path.name for path in Path('.github/workflows').glob('*.y*ml'))
          if workflows != ['ci.yml']:
              raise SystemExit(f'unexpected permanent workflows: {workflows}')
          PY
          git diff --exit-code
          git diff --check
      - name: Prove sole remote main branch
        run: |
          set -euo pipefail
          git ls-remote --heads origin > /tmp/dft-v4-branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [line.split()[1] for line in Path('/tmp/dft-v4-branches.txt').read_text().splitlines() if line.strip()]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
      - name: Package exact qualified DFT candidate
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/dft-v4-candidate"
          rm -rf "$bundle"
          mkdir -p "$bundle/.github/workflows" "$bundle/tests"
          cp .github/workflows/ci.yml "$bundle/.github/workflows/ci.yml"
          cp tests/test_permanent_ci_contract.py "$bundle/tests/test_permanent_ci_contract.py"
          printf '%s\n' \
            '.github/workflows/v4-fail-closed-hardening-once.yml' \
            '.github/workflows/v4-strict-hardening-once.yml' \
            > "$bundle/DELETIONS.txt"
          git rev-parse HEAD^ > "$bundle/PARENT_SHA.txt"
          git rev-parse HEAD > "$bundle/CANDIDATE_SHA.txt"
          git diff-tree --no-commit-id --name-status -r HEAD > "$bundle/CHANGES.tsv"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - name: Upload exact qualified DFT candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dft-v4-exact-candidate-${{ steps.candidate.outputs.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Attempt native exact-parent publication
        run: |
          set -euo pipefail
          git fetch origin main
          expected_parent="$(git rev-parse HEAD^)"
          remote_main="$(git rev-parse origin/main)"
          if [[ "$expected_parent" != "$remote_main" ]]; then
            echo "STALE_MAIN expected_parent=$expected_parent remote_main=$remote_main" >&2
            exit 3
          fi
          git push origin HEAD:main
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_FAIL_CLOSED_HARDENING_V4 outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} bundle=uploaded controllers=removed direct_failure=true evidence_upload=preserved workflows=ci-only branch=main-only"

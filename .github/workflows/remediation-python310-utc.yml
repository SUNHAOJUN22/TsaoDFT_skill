name: One-shot DFT Python 3.10 UTC compatibility

on:
  push:
    branches:
      - remediation/remove-exact-tree-export

permissions:
  contents: write

concurrency:
  group: dft-python310-utc-remediation
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/remove-exact-tree-export
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py310.txt

      - name: Install exact Python 3.10 validation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py310.txt -r requirements-dev.txt
          python -m pip check

      - name: Replace Python 3.11-only UTC alias
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remediation-python310-utc.yml
          python - <<'PY'
          import re
          from pathlib import Path

          paths = (
              Path('tests/test_v7_execution_and_scientific_acceptance.py'),
              Path('tests/test_v5_model_acceptance.py'),
              Path('skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py'),
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              old_import = 'from datetime import UTC, datetime'
              if text.count(old_import) != 1:
                  raise SystemExit(f'{path}: expected exactly one UTC import')
              text = text.replace(old_import, 'from datetime import datetime, timezone')
              text, replacements = re.subn(r'\bUTC\b', 'timezone.utc', text)
              if replacements < 1:
                  raise SystemExit(f'{path}: no UTC use was replaced')
              if re.search(r'\bUTC\b', text):
                  raise SystemExit(f'{path}: UTC alias remains')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -m ruff check --fix \
            tests/test_v7_execution_and_scientific_acceptance.py \
            tests/test_v5_model_acceptance.py \
            skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py
          python -m ruff format \
            tests/test_v7_execution_and_scientific_acceptance.py \
            tests/test_v5_model_acceptance.py \
            skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py

      - name: Run the complete Python 3.10 quality gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality_gate.py
          git diff --check

      - name: Verify bounded diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- coverage-report.json
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/remediation-python310-utc.yml',
              'tests/test_v7_execution_and_scientific_acceptance.py',
              'tests/test_v5_model_acceptance.py',
              'skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected final diff: expected={sorted(expected)!r} actual={sorted(actual)!r}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(compat): support timezone UTC on Python 3.10"
          git push origin HEAD:remediation/remove-exact-tree-export

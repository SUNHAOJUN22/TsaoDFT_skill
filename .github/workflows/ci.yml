name: TsaoDFT quality and security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: tsao-dft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraint: constraints/py310.txt
          - python-version: "3.12"
            constraint: constraints/py312.txt
          - python-version: "3.13"
            constraint: constraints/py313.txt
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ${{ matrix.constraint }}

      - name: Install and verify locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c "${{ matrix.constraint }}" -r requirements-dev.txt
          python -m pip check

      - name: Normalize governance branch test in checkout
        run: python -m ruff format tests/test_release_governance_branch_closure.py

      - name: Upload normalized governance branch test
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: normalized-governance-branch-test-${{ github.sha }}
          path: tests/test_release_governance_branch_closure.py
          if-no-files-found: error
          retention-days: 7

      - name: Capture complete quality gate
        id: gate
        shell: bash
        run: |
          set +e
          python scripts/quality_gate.py 2>&1 | tee quality-gate.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload failure log
        if: always() && steps.gate.outputs.exit_code != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-python-${{ matrix.python-version }}
          path: quality-gate.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}-${{ github.sha }}
          path: coverage-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish best-effort compatibility summary
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: bash
        run: |
          state=failure
          description='TsaoDFT quality gate failed'
          if [ "$GATE_EXIT_CODE" = '0' ]; then
            state=success
            description='TsaoDFT quality gate passed'
          fi
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context="tsao-dft/python-$PYTHON_VERSION" \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Fail job when quality gate fails
        if: always() && steps.gate.outputs.exit_code != '0'
        run: exit 1

  supply-chain:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install audited locked dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Audit runtime dependency range
        run: python -m pip_audit -r requirements.txt --format json --output pip-audit-runtime.json

      - name: Audit development dependency range
        run: python -m pip_audit -r requirements-dev.txt --format json --output pip-audit-development.json

      - name: Audit exact locked environment
        run: python -m pip_audit --no-deps -r constraints/py312.txt --format json --output pip-audit-locked.json

      - name: Generate locked CycloneDX SBOM
        run: python -m pip_audit --no-deps -r constraints/py312.txt --format cyclonedx-json --output sbom.cdx.json

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            pip-audit-runtime.json
            pip-audit-development.json
            pip-audit-locked.json
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL Python analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: "/language:python"

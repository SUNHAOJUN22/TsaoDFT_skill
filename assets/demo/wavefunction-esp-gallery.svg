<rect x="0" y="0" width="1120" height="470" rx="0" fill="#F6F8FC"/><text x="30" y="40" class="eyebrow">FIGURE CONTRACT</text><text x="30" y="76" class="title">Electronic-structure visuals must show source, scale and boundary.</text><rect x="30" y="108" width="330" height="246" rx="18" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><text x="48" y="140" class="label">ORBITAL</text><text x="48" y="163" class="small">phase + isovalue</text><ellipse cx="161" cy="248" rx="70" ry="34" fill="#2563EB" opacity=".82" transform="rotate(-22 161 248)"/><ellipse cx="229" cy="248" rx="70" ry="34" fill="#D97706" opacity=".82" transform="rotate(22 229 248)"/><circle cx="195" cy="248" r="12" fill="#0B1220"/><line x1="48" y1="326" x2="342" y2="326" stroke="#E9EEF5" stroke-width="1"/><text x="48" y="344" class="tiny">source file · method · state · units</text><rect x="380" y="108" width="330" height="246" rx="18" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><text x="398" y="140" class="label">ESP SURFACE</text><text x="398" y="163" class="small">units + color scale</text><circle cx="545" cy="248" r="72" fill="#CFFAFE" stroke="#0891B2" stroke-width="2"/><path d="M475 266 Q521 200 555 243 T615 228" fill="none" stroke="#DC2626" stroke-width="10" opacity=".6"/><path d="M473 290 Q525 263 557 290 T615 260" fill="none" stroke="#2563EB" stroke-width="12" opacity=".55"/><line x1="398" y1="326" x2="692" y2="326" stroke="#E9EEF5" stroke-width="1"/><text x="398" y="344" class="tiny">source file · method · state · units</text><rect x="730" y="108" width="330" height="246" rx="18" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><text x="748" y="140" class="label">DENSITY DIFFERENCE</text><text x="748" y="163" class="small">reference + sign</text><circle cx="853" cy="230" r="30" fill="#2563EB"/><circle cx="891" cy="270" r="38" fill="#D97706"/><circle cx="937" cy="240" r="26" fill="#2563EB"/><circle cx="913" cy="206" r="18" fill="#D97706"/><line x1="748" y1="326" x2="1042" y2="326" stroke="#E9EEF5" stroke-width="1"/><text x="748" y="344" class="tiny">source file · method · state · units</text><rect x="30" y="378" width="1030" height="48" rx="14" fill="#101A2D"/><text x="52" y="408" class="eyebrow" style="fill:#93C5FD">REQUIRED</text><text x="166" y="408" class="small" style="fill:#D7E4F5">legend</text><text x="280" y="408" class="small" style="fill:#D7E4F5">scale</text><text x="390" y="408" class="small" style="fill:#D7E4F5">orientation</text><text x="538" y="408" class="small" style="fill:#D7E4F5">method fingerprint</text><text x="744" y="408" class="small" style="fill:#D7E4F5">synthetic / computed status</text><text x="1092" y="452" class="tiny" text-anchor="end">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>
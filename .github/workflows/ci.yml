name: One-shot governance mypy patch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tsao-governance-mypy-patch
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: apply governance mypy patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply typed case table
        run: |
          python .github/patch_gov_mypy.py
          python -m py_compile tests/test_release_governance_branch_closure.py

      - name: Commit target and remove patcher
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch_gov_mypy.py
          git add tests/test_release_governance_branch_closure.py
          git commit -m "test: type governance CLI case table"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

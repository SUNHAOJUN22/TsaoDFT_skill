</defs><rect width="640" height="360" rx="26" fill="url(#bg)"/><rect width="640" height="360" rx="26" fill="url(#grid)"/><circle cx="520" cy="125" r="150" fill="url(#halo)" opacity=".22"/><text x="28" y="38" class="k">EXECUTION · RESTART · HASHES</text><text x="28" y="72" class="h2" font-size="27">HPC Provenance</text><text x="28" y="96" class="s">Every run traceable from input to accepted artifact</text><rect x="22" y="116" width="596" height="202" rx="22" class="glass" filter="url(#shadow)"/><g transform="translate(48 148)"><g fill="#0a2139" stroke="#2f638c"><rect x="0" y="0" width="120" height="128" rx="16"/><rect x="146" y="0" width="120" height="128" rx="16"/><rect x="292" y="0" width="120" height="128" rx="16"/></g><g class="n" text-anchor="middle"><text x="60" y="27">INPUT HASH</text><text x="206" y="27">JOB RECORD</text><text x="352" y="27">OUTPUT HASH</text></g><g fill="#34d399"><circle cx="34" cy="55" r="6"/><circle cx="60" cy="55" r="6"/><circle cx="86" cy="55" r="6"/></g><g fill="#a78bfa"><rect x="176" y="48" width="60" height="10" rx="5"/><rect x="176" y="70" width="42" height="10" rx="5"/></g><path d="M120 63H146M266 63H292" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/><g class="m" text-anchor="middle"><text x="60" y="101">method + geometry</text><text x="206" y="101">Slurm / PBS / local</text><text x="352" y="101">logs + artifacts</text></g><rect x="438" y="0" width="120" height="128" rx="16" fill="#0a2139" stroke="#fbbf24"/><text x="498" y="27" text-anchor="middle" class="n">RESTART LINEAGE</text><path d="M470 77a28 28 0 1 0 22-32" fill="none" stroke="#fbbf24" stroke-width="3"/><path d="M488 38l12 10-15 6" fill="#fbbf24"/><text x="498" y="111" text-anchor="middle" class="m">checkpoint → child job</text><text x="279" y="154" text-anchor="middle" class="m">RESOURCE ESTIMATE · CHECKPOINT · PROVENANCE · ACCEPTANCE</text></g><rect x="0" y="332" width="640" height="28" fill="#020617" fill-opacity=".92"/><text x="622" y="351" text-anchor="end
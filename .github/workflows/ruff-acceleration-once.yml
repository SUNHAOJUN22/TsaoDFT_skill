name: One-shot acceleration Ruff fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ruff-acceleration-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.15.22"
      - name: Apply exact Ruff fixes
        run: |
          python -m ruff check --fix \
            skills/tsao-dft-hpc-provenance/scripts/validate_hpc_manifest.py \
            skills/tsao-dft-hpc-provenance/scripts/generate_job_script.py \
            skills/tsao-dft-hpc-provenance/scripts/materialize_acceleration_campaign.py \
            skills/tsao-dft-hpc-provenance/tests/test_acceleration_execution.py
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/scripts/validate_hpc_manifest.py \
            skills/tsao-dft-hpc-provenance/scripts/generate_job_script.py \
            skills/tsao-dft-hpc-provenance/scripts/materialize_acceleration_campaign.py \
            skills/tsao-dft-hpc-provenance/tests/test_acceleration_execution.py
      - name: Commit formatter output and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/ruff-acceleration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/tsao-dft-hpc-provenance/scripts/validate_hpc_manifest.py \
            skills/tsao-dft-hpc-provenance/scripts/generate_job_script.py \
            skills/tsao-dft-hpc-provenance/scripts/materialize_acceleration_campaign.py \
            skills/tsao-dft-hpc-provenance/tests/test_acceleration_execution.py
          git commit -m "style: apply exact Ruff acceleration fixes"
          git push origin HEAD:main

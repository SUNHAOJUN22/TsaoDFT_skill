name: TsaoDFT one-time exact Ruff formatter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsao-dft-exact-ruff-format
  cancel-in-progress: true

jobs:
  format-and-restore:
    name: Format sources and restore permanent gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Format audited files and restore permanent workflow
        run: |
          python -m ruff format \
            scripts/generate_readme_demos.py \
            scripts/validate_ai_assets.py \
            scripts/validate_readme_visuals.py \
            tests/test_ai_assets.py \
            tests/test_readme_visuals.py
          python -m ruff check \
            scripts/generate_readme_demos.py \
            scripts/validate_ai_assets.py \
            scripts/validate_readme_visuals.py \
            tests/test_ai_assets.py \
            tests/test_readme_visuals.py
          python -m ruff format --check \
            scripts/generate_readme_demos.py \
            scripts/validate_ai_assets.py \
            scripts/validate_readme_visuals.py \
            tests/test_ai_assets.py \
            tests/test_readme_visuals.py
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit exact formatter output to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            scripts/generate_readme_demos.py \
            scripts/validate_ai_assets.py \
            scripts/validate_readme_visuals.py \
            tests/test_ai_assets.py \
            tests/test_readme_visuals.py
          git commit -m "style: apply pinned Ruff formatting and restore CI"
          git push origin HEAD:main

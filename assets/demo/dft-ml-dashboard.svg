.label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.9px;fill:#526175}
.mono12{font-family:JetBrains Mono,SFMono-Regular,Consolas,monospace;font-size:12px;font-weight:600;fill:#0B1220}
</style>
<rect x="0" y="0" width="1120" height="500" rx="0" fill="#F6F8FC"/><text x="30" y="40" class="eyebrow">DFT + ML EVIDENCE</text><text x="30" y="76" class="title">Model score is one panel—not the scientific conclusion.</text><rect x="30" y="110" width="250" height="104" rx="16" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><circle cx="50" cy="133" r="6" fill="#2563EB"/><text x="66" y="138" class="label">DATA IDENTITY</text><text x="48" y="171" class="body">parent groups</text><text x="48" y="194" class="small">method fingerprints</text><rect x="294" y="110" width="250" height="104" rx="16" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><circle cx="314" cy="133" r="6" fill="#0891B2"/><text x="330" y="138" class="label">SPLIT POLICY</text><text x="312" y="171" class="body">group / scaffold</text><text x="312" y="194" class="small">no leakage</text><rect x="558" y="110" width="250" height="104" rx="16" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><circle cx="578" cy="133" r="6" fill="#D97706"/><text x="594" y="138" class="label">UNCERTAINTY</text><text x="576" y="171" class="body">calibration</text><text x="576" y="194" class="small">applicability domain</text><rect x="822" y="110" width="268" height="104" rx="16" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><circle cx="842" cy="133" r="6" fill="#16A34A"/><text x="858" y="138" class="label">CLAIM STATUS</text><text x="840" y="171" class="body">baseline only</text><text x="840" y="194" class="small">bounded evidence</text><rect x="30" y="234" width="660" height="218" rx="16" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><text x="52" y="264" class="label">PREDICTION VS TARGET</text><line x1="78" y1="410" x2="642" y2="410" stroke="#0B1220" stroke-width="2"/><line x1="78" y1="294" x2="78" y2="410" stroke="#0B1220" stroke-width="2"/><line x1="98" y1="394" x2="612" y2="302" stroke="#E9EEF5" stroke-width="2" stroke-dasharray="6 5"/><circle cx="120" cy="388" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><circle cx="180" cy="365" r="7" fill="#0891B2" stroke="#FFFFFF" stroke-width="2"/><circle cx="250" cy="354" r="7" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/><circle cx="315" cy="332" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/><circle cx="380" cy="320" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><circle cx="445" cy="310" r="7" fill="#0891B2" stroke="#FFFFFF" stroke-width="2"/><circle cx="520" cy="290" r="7" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/><circle cx="590" cy="284" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/><text x="90" y="432" class="tiny">target</text><text x="58" y="302" class="tiny">prediction</text><rect x="710" y="234" width="380" height="218" rx="16" fill="#101A2D"/><text x="734" y="264" class="eyebrow" style="fill:#93C5FD">RELEASE CHECK</text><text x="734" y="302" class="small" style="fill:#D7E4F5">group leakage</text><rect x="938" y="283" width="126" height="28" rx="14" fill="#173C35"/><text x="1001.0" y="302" class="label" text-anchor="middle" style="fill:#BBF7D0">PASS</text><text x="734" y="338" class="small" style="fill:#D7E4F5">test-set isolation</text><rect x="938" y="319" width="126" height="28" rx="14" fill="#173C35"/><text x="1001.0" y="338" class="label" text-anchor="middle" style="fill:#BBF7D0">PASS</text><text x="734" y="374" class="small" style="fill:#D7E4F5">uncertainty record</text><rect x="938" y="355" width="126" height="28" rx="14" fill="#4A3514"/><text x="1001.0" y="374" class="label" text-anchor="middle" style="fill:#FDE68A">REVIEW</text><text x="734" y="410" class="small" style="fill:#D7E4F5">external validation</text><rect x="938" y="391" width="126" height="28" rx="14" fill="#1E3A5F"/><text x="1001.0" y="410" class="label" text-anchor="middle" style="fill:#BFDBFE">NOT CLAIMED</text><text x="1092" y="482" class="tiny" text-anchor="end">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>
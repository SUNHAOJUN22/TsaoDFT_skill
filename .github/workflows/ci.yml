name: TsaoDFT exact Ruff artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: tsao-dft-exact-ruff-artifact
  cancel-in-progress: true

jobs:
  format:
    name: Export exact Ruff 0.15.22 sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Format audited files
        run: |
          python -m ruff format \
            scripts/generate_readme_demos.py \
            scripts/validate_ai_assets.py \
            scripts/validate_readme_visuals.py \
            tests/test_ai_assets.py \
            tests/test_readme_visuals.py
          python -m ruff check \
            scripts/generate_readme_demos.py \
            scripts/validate_ai_assets.py \
            scripts/validate_readme_visuals.py \
            tests/test_ai_assets.py \
            tests/test_readme_visuals.py
          python -m ruff format --check \
            scripts/generate_readme_demos.py \
            scripts/validate_ai_assets.py \
            scripts/validate_readme_visuals.py \
            tests/test_ai_assets.py \
            tests/test_readme_visuals.py

      - name: Upload exact formatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-ruff-formatted-sources
          path: |
            scripts/generate_readme_demos.py
            scripts/validate_ai_assets.py
            scripts/validate_readme_visuals.py
            tests/test_ai_assets.py
            tests/test_readme_visuals.py
          if-no-files-found: error
          retention-days: 1

      - name: Publish formatter run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          payload = json.dumps(
              {
                  "state": "success",
                  "context": "tsao-dft/exact-ruff-artifact",
                  "description": "Exact Ruff 0.15.22 sources are available",
                  "target_url": f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              }
          ).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status)
          PY

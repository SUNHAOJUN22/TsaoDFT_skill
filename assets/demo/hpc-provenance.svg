<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc" >
<title id="title">HPC execution and provenance</title><desc id="desc">Synthetic HPC batch and provenance dashboard; not scientific data.</desc>
<defs><pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#E9EEF5"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0B1220" flood-opacity=".08"/></filter></defs><style>
.text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0B1220}
.mono{font-family:JetBrains Mono,SFMono-Regular,Consolas,monospace;fill:#0B1220}
.eyebrow{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:800;letter-spacing:1.8px;fill:#2563EB}
.title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:32px;font-weight:780;letter-spacing:-.7px;fill:#0B1220}
.h2{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:760;fill:#0B1220}
.body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:450;fill:#526175}
.small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:500;fill:#526175}
.tiny{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:10px;font-weight:650;letter-spacing:.5px;fill:#7A889B}
.label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.9px;fill:#526175}
.mono12{font-family:JetBrains Mono,SFMono-Regular,Consolas,monospace;font-size:12px;font-weight:600;fill:#0B1220}
</style>
<rect x="0" y="0" width="1120" height="450" rx="0" fill="#F6F8FC"/><text x="30" y="40" class="eyebrow">HPC EXECUTION</text><text x="30" y="76" class="title">Throughput, failure state and provenance stay separate.</text><rect x="30" y="110" width="480" height="278" rx="18" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><text x="52" y="144" class="label">SLURM ARRAY / BATCH DAG</text><rect x="52" y="156" width="430" height="28" rx="8" fill="#F6F8FC" stroke="#E9EEF5" stroke-width="1"/><text x="66" y="176" class="mono12">task 1</text><rect x="365" y="158" width="96" height="28" rx="14" fill="#DCFCE7"/><text x="413.0" y="177" class="label" text-anchor="middle" style="fill:#16A34A">DONE</text><rect x="52" y="194" width="430" height="28" rx="8" fill="#F6F8FC" stroke="#E9EEF5" stroke-width="1"/><text x="66" y="214" class="mono12">task 2</text><rect x="365" y="196" width="96" height="28" rx="14" fill="#DCFCE7"/><text x="413.0" y="215" class="label" text-anchor="middle" style="fill:#16A34A">DONE</text><rect x="52" y="232" width="430" height="28" rx="8" fill="#F6F8FC" stroke="#E9EEF5" stroke-width="1"/><text x="66" y="252" class="mono12">task 3</text><rect x="365" y="234" width="96" height="28" rx="14" fill="#FEF3C7"/><text x="413.0" y="253" class="label" text-anchor="middle" style="fill:#D97706">RUNNING</text><rect x="52" y="270" width="430" height="28" rx="8" fill="#F6F8FC" stroke="#E9EEF5" stroke-width="1"/><text x="66" y="290" class="mono12">task 4</text><rect x="365" y="272" width="96" height="28" rx="14" fill="#DBEAFE"/><text x="413.0" y="291" class="label" text-anchor="middle" style="fill:#2563EB">PENDING</text><rect x="52" y="308" width="430" height="28" rx="8" fill="#F6F8FC" stroke="#E9EEF5" stroke-width="1"/><text x="66" y="328" class="mono12">task 5</text><rect x="365" y="310" width="96" height="28" rx="14" fill="#FEE2E2"/><text x="413.0" y="329" class="label" text-anchor="middle" style="fill:#DC2626">FAILED</text><text x="52" y="370" class="tiny">% concurrency cap · no automatic submission</text><rect x="536" y="110" width="554" height="278" rx="18" fill="#101A2D"/><text x="560" y="144" class="eyebrow" style="fill:#93C5FD">IMMUTABLE RUN RECORD</text><circle cx="562" cy="178" r="5" fill="#2563EB"/><text x="578" y="182" class="label" style="fill:#FFFFFF">INPUT HASH</text><text x="880" y="182" class="mono12" text-anchor="end" style="fill:#C9D7E8">sha256: …e91c</text><circle cx="562" cy="216" r="5" fill="#0891B2"/><text x="578" y="220" class="label" style="fill:#FFFFFF">METHOD</text><text x="880" y="220" class="mono12" text-anchor="end" style="fill:#C9D7E8">MF-2026-014</text><circle cx="562" cy="254" r="5" fill="#6D5DFB"/><text x="578" y="258" class="label" style="fill:#FFFFFF">ENVIRONMENT</text><text x="880" y="258" class="mono12" text-anchor="end" style="fill:#C9D7E8">mpi · blas · modules</text><circle cx="562" cy="292" r="5" fill="#D97706"/><text x="578" y="296" class="label" style="fill:#FFFFFF">RESTART</text><text x="880" y="296" class="mono12" text-anchor="end" style="fill:#C9D7E8">parent attempt + checkpoint</text><circle cx="562" cy="330" r="5" fill="#16A34A"/><text x="578" y="334" class="label" style="fill:#FFFFFF">RESULT</text><text x="880" y="334" class="mono12" text-anchor="end" style="fill:#C9D7E8">parser status + output hash</text><text x="1092" y="432" class="tiny" text-anchor="end">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>
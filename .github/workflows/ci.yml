name: One-shot permanent Ruff repair

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-permanent-ruff-repair
  cancel-in-progress: false

jobs:
  repair:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: retry permanent Ruff repair' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/ruff-repair \
            -f description="Exact Ruff repair and full gate running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install reviewed environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Apply reviewed SIM108 and exact Ruff repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('skills/tsao-dft-hpc-provenance/scripts/inspect_execution_environment.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if errors:
              report = {"ok": False, "errors": errors, "inventory": report}
          else:
              report = {"ok": True, "inventory": report}
          '''
          new = '''    report = (
              {"ok": False, "errors": errors, "inventory": report}
              if errors
              else {"ok": True, "inventory": report}
          )
          '''
          if old not in text:
              raise SystemExit('reviewed SIM108 target was not found exactly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m ruff check --fix .
          python -m ruff format .
          git checkout e94340da02ca62d43b410235a5628cb696dd2e24 -- .github/workflows/ci.yml
          rm -f .github/workflows/ruff-repair-once.yml .github/ruff-repair.trigger

      - name: Run complete quality gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_gate.py 2>&1 | tee permanent-ruff-repair-quality.log

      - name: Commit and push net repair
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize trust and autotuning code"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            python scripts/quality_gate.py 2>&1 | tee "permanent-ruff-repair-rebased-${attempt}.log"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Exact Ruff repair or full gate failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Exact Ruff repair and full gate passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/ruff-repair \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permanent-ruff-repair-${{ github.sha }}
          path: permanent-ruff-repair-*.log
          if-no-files-found: warn
          retention-days: 14

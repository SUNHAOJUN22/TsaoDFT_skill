name: Apply skill-native V15 fix 1

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_skill_native_v15_fix1.py
      - .github/workflows/apply-skill-native-v15-fix1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsao-dft-skill-native-v15
  cancel-in-progress: false

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: python scripts/apply_skill_native_v15_fix1.py
      - run: python scripts/validate_skill.py --root . --report artifacts/skill-validation-v15.json
      - run: python -m unittest tests.test_scientific_contracts_v15 -v
      - shell: bash
        run: rm -f scripts/apply_skill_native_v15_fix1.py .github/workflows/apply-skill-native-v15-fix1.yml
      - name: Commit verified fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: stabilize TSAO DFT V15 contract test loader'
          git push origin HEAD:main

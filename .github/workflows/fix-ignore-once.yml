name: One-shot ignore-marker fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ignore-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Apply exact source fix and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("skills/tsao-dft-hpc-provenance/scripts/materialize_acceleration_campaign.py")
          text = path.read_text(encoding="utf-8")
          old = "from validate_hpc_manifest import validate as validate_manifest  # noqa: E402\n"
          new = (
              "from validate_hpc_manifest import validate as validate_manifest  "
              "# noqa: E402 -- local imports follow SCRIPT_DIR path setup\n"
          )
          if old not in text:
              raise SystemExit("expected import marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/fix-ignore-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/tsao-dft-hpc-provenance/scripts/materialize_acceleration_campaign.py
          git commit -m "style: explain acceleration materializer import marker"
          git push origin HEAD:main

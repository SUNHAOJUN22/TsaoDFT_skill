name: Apply comprehensive skill-native V18

on:
  push:
    branches: [main]
    paths:
      - .tsao-skill-native-v18/**
      - scripts/apply_tsao_skill_native_v18.py
      - .github/workflows/apply-tsao-skill-native-v18.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tsao-dft-skill-native-v18
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Apply verified V18 scientific-core payload
        run: python scripts/apply_tsao_skill_native_v18.py
      - name: Repair generated V18 static typing contracts
        run: python .tsao-skill-native-v18/repair_mypy_contracts.py
      - name: Remove one-shot and obsolete workflow surfaces before validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tsao-skill-native-v18
          rm -f scripts/apply_tsao_skill_native_v18.py
          rm -f .github/workflows/apply-tsao-skill-native-v18.yml
          rm -f .github/workflows/capture-dft-v18-generated.yml
          rm -f .github/workflows/apply-skill-native-v15-fix1.yml
          rm -f .github/workflows/apply-skill-native-v15-fix2.yml
          rm -f .github/workflows/branch-hygiene-v15.yml
          rm -f .github/workflows/contracts-v17.yml
      - name: Install locked quality environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check
      - name: Normalize V18 scientific and test surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tests/test_v7_execution_and_scientific_acceptance.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'SHA = lambda c: c * 64': (
                  'def sha(char: str) -> str:\n'
                  '    return char * 64'
              ),
              '    bad = parser_record(); bad["parser_accepted"] = False; bad["status"] = "FATAL"': (
                  '    bad = parser_record()\n'
                  '    bad["parser_accepted"] = False\n'
                  '    bad["status"] = "FATAL"'
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one generated V7 pattern: {old}")
              text = text.replace(old, new, 1)
          text = text.replace("SHA(", "sha(")
          if "import importlib\n" not in text:
              text = text.replace("import json\n", "import importlib\nimport json\n", 1)
          import_pattern = re.compile(
              r"from execution_evidence_v7 import \(\n"
              r"(?P<body>(?:    [A-Za-z_][A-Za-z0-9_]*,\n)+)"
              r"\)\n"
              r"from scientific_acceptance_gate_v7 import evaluate_dft_acceptance_v7\n"
          )
          dynamic_imports = (
              '_execution_evidence = importlib.import_module("execution_evidence_v7")\n'
              '_scientific_acceptance_gate = importlib.import_module(\n'
              '    "scientific_acceptance_gate_v7"\n'
              ')\n'
              'ExecutionEvidenceError = _execution_evidence.ExecutionEvidenceError\n'
              'issue_execution_receipt = _execution_evidence.issue_execution_receipt\n'
              'issue_scientific_review = _execution_evidence.issue_scientific_review\n'
              'verify_scientific_review = _execution_evidence.verify_scientific_review\n'
              'evaluate_dft_acceptance_v7 = (\n'
              '    _scientific_acceptance_gate.evaluate_dft_acceptance_v7\n'
              ')\n'
          )
          text, count = import_pattern.subn(dynamic_imports, text, count=1)
          if count != 1:
              raise SystemExit("generated V18 bootstrap import block was not found exactly once")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          targets=(
            skills/tsao-dft-hpc-provenance/scripts/contracts_v17.py
            tests/test_scientific_contracts_v16.py
            tests/test_parser_tst_v4.py
            tests/test_v4_dft_contracts.py
            tests/test_v4_dft_scientific_contracts.py
            tests/test_v5_dft_evidence_and_uncertainty.py
            tests/test_v5_model_acceptance.py
            tests/test_v6_scientific_acceptance_gate.py
            tests/test_v7_execution_and_scientific_acceptance.py
          )
          python -m ruff check "${targets[@]}" --fix --unsafe-fixes --exit-zero
          python -m ruff format "${targets[@]}"
          python -m ruff check "${targets[@]}"
          python -m ruff format --check "${targets[@]}"
          git diff --check
      - name: Run authoritative repository quality gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_gate.py 2>&1 | tee /tmp/v18-quality-gate.log
      - name: Clean ignored runtime outputs
        shell: bash
        run: git clean -fdX
      - name: Commit verified V18 source to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected V18 source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: close DFT parser, TST, ML, and quantity contracts V18'
          git push origin HEAD:main
      - name: Open diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf 'Workflow run: %s/actions/runs/%s\nCommit: %s\n' '${{ github.server_url }}/${{ github.repository }}' '${{ github.run_id }}' '${{ github.sha }}' > /tmp/v18-failure.txt
          for log in /tmp/v18-*.log; do
            if [[ -f "$log" ]]; then
              printf '\n===== %s =====\n' "$(basename "$log")" >> /tmp/v18-failure.txt
              tail -n 260 "$log" >> /tmp/v18-failure.txt
            fi
          done
          gh issue create --title 'V18 remediation failed (run ${{ github.run_id }})' --body-file /tmp/v18-failure.txt

name: Apply canonical acceleration registry refactor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-registry-refactor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt

      - name: Replace duplicated acceleration catalogs with registry views
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          hpc = root / "skills" / "tsao-dft-hpc-provenance" / "scripts"

          plan_path = hpc / "plan_acceleration.py"
          plan = plan_path.read_text(encoding="utf-8")
          start = plan.index("BACKEND_BY_VENDOR = {")
          end = plan.index("COMMANDS = {", start)
          plan_registry = '''def _load_acceleration_registry() -> Any:
              path = Path(__file__).with_name("acceleration_registry.py")
              spec = importlib.util.spec_from_file_location("tsao_plan_acceleration_registry", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot import {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          _REGISTRY = _load_acceleration_registry()
          BACKEND_BY_VENDOR = dict(_REGISTRY.BACKEND_BY_VENDOR)
          BACKEND_VENDORS = {name: set(_REGISTRY.BACKEND_VENDORS[name]) for name in BACKENDS}
          LIBRARIES: dict[str, dict[str, str]] = _REGISTRY.plan_libraries()
          ALIASES: dict[str, str] = _REGISTRY.plan_aliases()


          '''
          plan_registry = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in plan_registry.splitlines()
          ) + "\n"
          plan_path.write_text(plan[:start] + plan_registry + plan[end:], encoding="utf-8")

          contract_path = hpc / "hardware_optimization_contract.py"
          contract = contract_path.read_text(encoding="utf-8")
          contract = contract.replace(
              "import math\nimport re\nfrom typing import Any\n",
              "import importlib.util\nimport math\nimport re\nfrom pathlib import Path\nfrom typing import Any\n",
              1,
          )
          start = contract.index("BACKEND_VENDORS = {")
          end = contract.index("def normalize_library(value: str) -> str:", start)
          optimizer_registry = '''def _load_acceleration_registry() -> Any:
              path = Path(__file__).with_name("acceleration_registry.py")
              spec = importlib.util.spec_from_file_location("tsao_optimizer_acceleration_registry", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot import {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          _REGISTRY = _load_acceleration_registry()
          BACKEND_VENDORS = {name: set(_REGISTRY.BACKEND_VENDORS[name]) for name in BACKENDS}
          LIBRARIES: dict[str, dict[str, str]] = _REGISTRY.optimizer_libraries()
          ALIASES: dict[str, str] = _REGISTRY.optimizer_aliases()


          '''
          optimizer_registry = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in optimizer_registry.splitlines()
          ) + "\n"
          contract_path.write_text(
              contract[:start] + optimizer_registry + contract[end:],
              encoding="utf-8",
          )

          validator_path = root / "scripts" / "validate_acceleration_registry.py"
          validator = validator_path.read_text(encoding="utf-8")
          anchor = '''    for alias, target in registry.optimizer_aliases().items():
              if contract.normalize_library(alias) != target:
                  errors.append(f"hardware optimizer alias {alias!r} does not normalize to {target!r}")

          '''
          anchor = "\n".join(
              line[4:] if line.startswith("    ") else line for line in anchor.splitlines()
          ) + "\n"
          source_guard = anchor + '''    for path in (PLAN_PATH, CONTRACT_PATH):
              source = path.read_text(encoding="utf-8")
              if "def _library(" in source:
                  errors.append(f"{path.name} still defines a duplicated acceleration library catalog")
              if "_load_acceleration_registry" not in source:
                  errors.append(f"{path.name} does not load acceleration_registry.py")

          '''
          source_guard = "\n".join(
              line[4:] if line.startswith("    ") else line
              for line in source_guard.splitlines()
          ) + "\n"
          if "still defines a duplicated acceleration library catalog" not in validator:
              if anchor not in validator:
                  raise RuntimeError("validator insertion anchor not found")
              validator = validator.replace(anchor, source_guard, 1)
          validator_path.write_text(validator, encoding="utf-8")
          PY

      - name: Format and run focused contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/scripts/plan_acceleration.py \
            skills/tsao-dft-hpc-provenance/scripts/hardware_optimization_contract.py \
            scripts/validate_acceleration_registry.py
          python -m ruff check \
            skills/tsao-dft-hpc-provenance/scripts/plan_acceleration.py \
            skills/tsao-dft-hpc-provenance/scripts/hardware_optimization_contract.py \
            scripts/validate_acceleration_registry.py
          python scripts/validate_acceleration_registry.py
          python -m unittest discover -s tests -p 'test_acceleration_registry.py'
          python -m unittest discover -s skills/tsao-dft-hpc-provenance/tests -p 'test_acceleration_planner.py'
          python -m unittest discover -s skills/tsao-dft-hpc-provenance/tests -p 'test_hardware_aware_optimizer.py'

      - name: Commit directly to main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-registry-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: load acceleration planners from canonical registry"
          git pull --rebase origin main
          git push origin HEAD:main

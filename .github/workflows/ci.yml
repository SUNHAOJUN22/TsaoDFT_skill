name: One-shot reviewed baseline migration

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-reviewed-baseline-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: execute reviewed baseline migration helper' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/baseline-migration \
            -f description="Reviewed baseline migration running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Apply reviewed migration
        run: |
          python .github/complete_baseline_migration.py
          python -m ruff check --fix .
          python -m ruff format .
          git checkout 19ab8e80d65aa6e34da3ed02366f8bd7b12568b2 -- .github/workflows/ci.yml
          rm -f .github/complete_baseline_migration.py
          rm -f .github/workflows/ruff-repair-once.yml .github/ruff-repair.trigger

      - name: Run complete quality gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_gate.py 2>&1 | tee baseline-migration-quality.log

      - name: Commit, rebase, revalidate and push
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete baseline trust and transaction migration"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            python scripts/quality_gate.py 2>&1 | tee "baseline-migration-rebased-${attempt}.log"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Reviewed baseline migration failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Reviewed baseline migration passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/baseline-migration \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-migration-${{ github.sha }}
          path: baseline-migration-*.log
          if-no-files-found: warn
          retention-days: 14

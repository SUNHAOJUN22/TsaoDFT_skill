name: TsaoDFT quality and security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: tsao-dft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraint: constraints/py310.txt
          - python-version: "3.12"
            constraint: constraints/py312.txt
          - python-version: "3.13"
            constraint: constraints/py313.txt
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ${{ matrix.constraint }}

      - name: Install and verify locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c "${{ matrix.constraint }}" -r requirements-dev.txt
          python -m pip check

      - name: Capture complete quality gate
        id: gate
        shell: bash
        run: |
          set +e
          python scripts/quality_gate.py 2>&1 | tee quality-gate.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload failure log
        if: always() && steps.gate.outputs.exit_code != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-python-${{ matrix.python-version }}
          path: quality-gate.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}-${{ github.sha }}
          path: coverage-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish best-effort compatibility summary
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: bash
        run: |
          state=failure
          description='TsaoDFT quality gate failed'
          if [ "$GATE_EXIT_CODE" = '0' ]; then
            state=success
            description='TsaoDFT quality gate passed'
          fi
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context="tsao-dft/python-$PYTHON_VERSION" \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Fail job when quality gate fails
        if: always() && steps.gate.outputs.exit_code != '0'
        run: exit 1

  windows-control-plane:
    name: Windows PowerShell control plane
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      statuses: write
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install and verify locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Capture privacy-bounded Windows inventory
        shell: pwsh
        run: |
          $pwsh = (Get-Command -Name "pwsh" -CommandType Application -ErrorAction Stop).Source
          & $pwsh -NoProfile -File ".\skills\tsao-dft-hpc-provenance\scripts\inspect_windows_environment.ps1" -Out "windows-environment.json"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows environment inventory failed"
          }
          $report = Get-Content -LiteralPath "windows-environment.json" -Raw | ConvertFrom-Json
          if (-not $report.ok) {
            throw "Windows environment inventory is not valid"
          }
          if ($report.external_dft_engine_invoked -ne $false) {
            throw "Windows inventory invoked an external DFT engine"
          }
          if ($report.performance_qualification -ne "NOT_ELIGIBLE") {
            throw "Windows inventory was misclassified as performance evidence"
          }
          foreach ($field in @(
            "hostname_recorded",
            "username_recorded",
            "home_path_recorded",
            "environment_values_recorded",
            "executable_paths_recorded"
          )) {
            if ($report.privacy.$field -ne $false) {
              throw "Windows inventory privacy contract failed for $field"
            }
          }

      - name: Capture complete PowerShell quality gate
        id: windows-gate
        shell: pwsh
        run: |
          $pwsh = (Get-Command -Name "pwsh" -CommandType Application -ErrorAction Stop).Source
          & $pwsh -NoProfile -File ".\scripts\quality_gate.ps1" *>&1 |
            Tee-Object -FilePath "windows-quality-gate.log"
          $code = $LASTEXITCODE
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "exit_code=$code" -Encoding utf8
          exit 0

      - name: Upload Windows control-plane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-control-plane-${{ github.sha }}
          path: |
            windows-environment.json
            windows-quality-gate.log
            coverage-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish best-effort Windows compatibility summary
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EXIT_CODE: ${{ steps.windows-gate.outputs.exit_code }}
        shell: pwsh
        run: |
          $state = "failure"
          $description = "TsaoDFT Windows PowerShell gate failed"
          if ($env:GATE_EXIT_CODE -eq "0") {
            $state = "success"
            $description = "TsaoDFT Windows PowerShell gate passed"
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
              -f "state=$state" `
              -f "context=tsao-dft/windows-powershell" `
              -f "description=$description" `
              -f "target_url=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds ($attempt * 2)
          }
          exit 1

      - name: Fail job when PowerShell quality gate fails
        if: always() && steps.windows-gate.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

  supply-chain:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install audited locked dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Capture all dependency audits and SBOM
        id: audit
        shell: bash
        run: |
          set +e
          runtime_code=0
          development_code=0
          locked_code=0
          sbom_code=0

          python -m pip_audit -r requirements.txt --format json --output pip-audit-runtime.json
          runtime_code=$?
          python -m pip_audit -r requirements-dev.txt --format json --output pip-audit-development.json
          development_code=$?
          python -m pip_audit --no-deps -r constraints/py312.txt --format json --output pip-audit-locked.json
          locked_code=$?
          python -m pip_audit --no-deps -r constraints/py312.txt --format cyclonedx-json --output sbom.cdx.json
          sbom_code=$?

          for report in pip-audit-runtime.json pip-audit-development.json pip-audit-locked.json sbom.cdx.json; do
            if [ ! -s "$report" ]; then
              printf '{"error":"audit command did not produce a report"}\n' > "$report"
            fi
          done

          echo "runtime_exit_code=$runtime_code" >> "$GITHUB_OUTPUT"
          echo "development_exit_code=$development_code" >> "$GITHUB_OUTPUT"
          echo "locked_exit_code=$locked_code" >> "$GITHUB_OUTPUT"
          echo "sbom_exit_code=$sbom_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            pip-audit-runtime.json
            pip-audit-development.json
            pip-audit-locked.json
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail job when an audit or SBOM command fails
        if: >-
          always() &&
          (steps.audit.outputs.runtime_exit_code != '0' ||
           steps.audit.outputs.development_exit_code != '0' ||
           steps.audit.outputs.locked_exit_code != '0' ||
           steps.audit.outputs.sbom_exit_code != '0')
        run: exit 1

  codeql:
    name: CodeQL Python analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: "/language:python"

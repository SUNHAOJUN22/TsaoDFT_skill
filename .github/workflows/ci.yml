name: One-shot research manifest coverage validation

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-research-manifest-validate
  cancel-in-progress: false

jobs:
  validate:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: separate research manifest artifact cases' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/research-manifest-coverage \
            -f description="Research manifest coverage tests running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Correct mutually exclusive artifact cases and validate tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('skills/tsao-dft-researcher/tests/test_release_research_manifest_coverage.py')
          text = path.read_text(encoding='utf-8')
          annotation_old = '        data = {"calculations": {}, "artifacts": {}, "claims": {}}\n'
          annotation_new = '        data: dict[str, Any] = {"calculations": {}, "artifacts": {}, "claims": {}}\n'
          if annotation_old in text:
              text = text.replace(annotation_old, annotation_new, 1)
          fragment_old = '''            "incompatible kind",\n            "is not validated",\n        )\n        for fragment in fragments:\n            self.assertTrue(any(fragment in error for error in errors), (fragment, errors))\n        self.assertTrue(any("spin contamination" in warning for warning in warnings))\n\n        missing_irc = self.base_manifest()\n'''
          fragment_new = '''            "incompatible kind",\n        )\n        for fragment in fragments:\n            self.assertTrue(any(fragment in error for error in errors), (fragment, errors))\n        self.assertTrue(any("spin contamination" in warning for warning in warnings))\n\n        unvalidated = copy.deepcopy(data)\n        unvalidated["calculations"][0]["validation"]["irc_reverse_artifact_id"] = "reverse"\n        unvalidated["artifacts"][0]["kind"] = "irc_forward"\n        self.assert_error(unvalidated, "is not validated")\n\n        missing_irc = self.base_manifest()\n'''
          if fragment_old not in text:
              raise SystemExit('research manifest mutually-exclusive fixture target missing')
          path.write_text(text.replace(fragment_old, fragment_new, 1), encoding='utf-8')
          PY
          target=skills/tsao-dft-researcher/tests/test_release_research_manifest_coverage.py
          python -m ruff check --fix "$target"
          python -m ruff format "$target"
          python -m ruff check "$target"
          python -m ruff format --check "$target"
          python -m mypy "$target"
          python -m unittest discover -s skills/tsao-dft-researcher/tests -p 'test_release_research_manifest_coverage.py' -v

      - name: Commit and push test file only
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/tsao-dft-researcher/tests/test_release_research_manifest_coverage.py
          git commit -m "test: validate research manifest coverage boundaries"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Research manifest coverage tests failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Research manifest coverage tests passed and were pushed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/research-manifest-coverage \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

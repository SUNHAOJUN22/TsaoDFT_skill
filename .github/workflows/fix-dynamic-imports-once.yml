name: Apply exact dynamic-import annotations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dynamic-imports-once.yml

permissions:
  contents: write
  statuses: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Capture exact annotations
        id: fix
        shell: bash
        run: |
          set +e
          {
            python .github/fix-dynamic-imports-once.py
            python -m ruff format .
            python -m ruff check .
            python -m ruff format --check .
          } 2>&1 | tee dynamic-import-fix.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload fix log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamic-import-fix-${{ github.sha }}
          path: dynamic-import-fix.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish fix status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.fix.outputs.exit_code }}
        run: |
          state=failure
          description='Dynamic-import annotation failed'
          if [ "$RESULT" = '0' ]; then
            state=success
            description='Dynamic-import annotations verified'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='tsao-dft/dynamic-import-fix' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove one-time files and commit
        if: steps.fix.outputs.exit_code == '0'
        run: |
          rm .github/fix-dynamic-imports-once.py
          rm .github/workflows/fix-dynamic-imports-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: annotate intentional dynamic imports and format security gates [skip ci]'
          git push origin HEAD:main

      - name: Fail when annotations failed
        if: steps.fix.outputs.exit_code != '0'
        run: exit 1

name: TsaoDFT one-shot formatter export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsao-dft-format-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-formatted-files:
    name: Export exact Ruff files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked formatter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt

      - name: Apply exact Ruff formatting
        run: |
          python -m ruff check --fix \
            skills/tsao-dft-hpc-provenance/scripts/validate_hpc_manifest.py \
            skills/tsao-dft-hpc-provenance/tests/test_acceleration_execution.py
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/scripts/validate_hpc_manifest.py \
            skills/tsao-dft-hpc-provenance/tests/test_acceleration_execution.py
          python -m ruff check \
            skills/tsao-dft-hpc-provenance/scripts/validate_hpc_manifest.py \
            skills/tsao-dft-hpc-provenance/tests/test_acceleration_execution.py
          python -m ruff format --check \
            skills/tsao-dft-hpc-provenance/scripts/validate_hpc_manifest.py \
            skills/tsao-dft-hpc-provenance/tests/test_acceleration_execution.py

      - name: Upload exact formatter output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruff-formatted-acceleration
          path: |
            skills/tsao-dft-hpc-provenance/scripts/validate_hpc_manifest.py
            skills/tsao-dft-hpc-provenance/tests/test_acceleration_execution.py
          if-no-files-found: error
          retention-days: 3

      - name: Publish export status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=tsao-dft/format-export \
            -f description='Exact Ruff formatter artifact exported' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

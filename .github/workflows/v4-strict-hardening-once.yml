name: V4 strict fail-closed hardening once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: v4-strict-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/run-v4-strict-hardening')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact qualification environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check
      - name: Build controller-free fail-closed candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text(encoding='utf-8')
          directive = '        continue-on-error: true\n'
          if text.count(directive) != 2:
              raise SystemExit(
                  f'expected exactly two continue-on-error directives, found {text.count(directive)}'
              )
          text = text.replace(directive, '')
          text = text.replace(
              '      - name: Publish best-effort compatibility summary\n',
              '      - name: Publish required compatibility summary\n',
              1,
          )
          text = text.replace(
              '      - name: Publish best-effort Windows compatibility summary\n',
              '      - name: Publish required Windows compatibility summary\n',
              1,
          )
          workflow.write_text(text, encoding='utf-8', newline='\n')
          Path('.github/workflows/v4-strict-hardening-once.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/ci.yml .github/workflows/v4-strict-hardening-once.yml
          git commit -m 'ci: make compatibility status publication fail closed'
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run complete DFT software, numerical, documentation and release gates
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python -m compileall -q scripts tsao_dft_skill tests
          python scripts/quality_gate.py
          python -m pytest -q
          python scripts/build_release_acceptance.py --help >/dev/null
          python scripts/capture_compute_contract_evidence.py --help >/dev/null
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          forbidden = ('continue-on-error:', '|| true', 'pytest ... || exit 0')
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'forbidden fail-open workflow constructs remain: {found}')
          PY
          git diff --exit-code
          git diff --check
      - name: Prove sole remote main branch
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin > /tmp/branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [line.split()[1] for line in Path('/tmp/branches.txt').read_text().splitlines() if line.strip()]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
      - name: Publish exact qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected_parent="$(git rev-parse HEAD^)"
          remote_main="$(git rev-parse origin/main)"
          if [[ "$expected_parent" != "$remote_main" ]]; then
            echo "STALE_MAIN expected_parent=$expected_parent remote_main=$remote_main" >&2
            exit 3
          fi
          git push origin HEAD:main
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_STRICT_HARDENING outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} controller=self_removed status_publication=required branch=main-only"

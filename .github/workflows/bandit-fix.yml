name: Close Bandit findings once

on:
  push:
    branches: [main]
    paths:
      - _bandit_fix/READY

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install exact development toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Apply exact repairs and remove temporary files
        run: python _bandit_fix/apply.py

      - name: Format and validate complete repository
        run: |
          python -m ruff format scripts/install.py scripts/validate_governance.py scripts/run_bandit.py scripts/run_type_checks.py
          python -m ruff check .
          python scripts/quality_gate.py

      - name: Commit verified closure to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close Bandit and governance findings [skip ci]'
          git push origin HEAD:main

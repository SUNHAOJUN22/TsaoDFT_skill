name: One-shot DFT CI retrigger cleanup

on:
  push:
    branches:
      - remediation/scientific-contracts-v8

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/scientific-contracts-v8
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rm .github/.dft-ci-retrigger
          rm .github/workflows/cleanup-dft-ci-retrigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): remove temporary CI retrigger surface"
          git push origin HEAD:remediation/scientific-contracts-v8

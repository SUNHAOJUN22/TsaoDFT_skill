name: DFT Python 3.10 UTC atomic source convergence v6

on:
  push:
    branches:
      - remediation/scientific-contracts-v8

permissions:
  contents: write

concurrency:
  group: dft-py310-utc-atomic-v6
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/scientific-contracts-v8
          fetch-depth: 0

      - name: Atomically commit Python 3.10 UTC compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('tests/test_v7_execution_and_scientific_acceptance.py'),
              Path('tests/test_v5_model_acceptance.py'),
              Path('skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py'),
          )
          for path in paths:
              original = path.read_text(encoding='utf-8')
              text = original.replace(
                  'from datetime import UTC, datetime',
                  'from datetime import datetime, timezone',
              )
              text = text.replace('tzinfo=UTC', 'tzinfo=timezone.utc')
              text = text.replace('.astimezone(UTC)', '.astimezone(timezone.utc)')
              if text == original:
                  raise SystemExit(f'{path}: no Python 3.11-only UTC reference was replaced')
              forbidden = (
                  'from datetime import UTC',
                  'tzinfo=UTC',
                  '.astimezone(UTC)',
              )
              unresolved = [token for token in forbidden if token in text]
              if unresolved:
                  raise SystemExit(f'{path}: unresolved executable UTC aliases: {unresolved!r}')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -m compileall -q \
            tests/test_v7_execution_and_scientific_acceptance.py \
            tests/test_v5_model_acceptance.py \
            skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              'tests/test_v7_execution_and_scientific_acceptance.py',
              'tests/test_v5_model_acceptance.py',
              'skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py',
          }
          rows = subprocess.check_output(['git', 'diff', '--name-status', 'HEAD'], text=True).splitlines()
          statuses: dict[str, str] = {}
          for row in rows:
              status, *paths = row.split('\t')
              for path in paths:
                  statuses[path] = status
          if set(statuses) != expected or any(statuses[path] != 'M' for path in expected):
              raise SystemExit(f'unexpected source diff: {statuses!r}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_v7_execution_and_scientific_acceptance.py \
            tests/test_v5_model_acceptance.py \
            skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py
          git commit -m "fix(compat): use timezone.utc on Python 3.10"
          git push origin HEAD:remediation/scientific-contracts-v8

      - name: Commit temporary workflow removal
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remediation-py310-utc.yml
          git add .github/workflows/remediation-py310-utc.yml
          git diff --cached --name-status --exit-code HEAD && exit 1 || true
          git commit -m "chore(ci): remove temporary Python 3.10 convergence workflow"
          git push origin HEAD:remediation/scientific-contracts-v8

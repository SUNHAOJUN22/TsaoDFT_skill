name: V4 DFT direct-failure exact export once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: v4-ci-export-once
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/export-v4-dft-candidate-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install constrained validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check
      - name: Build controller-free direct-failure candidate
        run: |
          set -euo pipefail
          python scripts/apply_v4_ci_hardening.py
          python -m ruff format scripts/apply_v4_ci_hardening.py tests/test_permanent_ci_contract.py
          git diff --check
      - name: Commit exact candidate
        id: candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: make DFT evidence gates directly fail closed'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run complete DFT qualification
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python -m unittest -q tests.test_permanent_ci_contract
          python scripts/quality_gate.py
          python scripts/build_release_acceptance.py --help >/dev/null
          python scripts/capture_compute_contract_evidence.py --help >/dev/null
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          forbidden = (
              'continue-on-error:', 'set +e', 'steps.gate.outputs',
              'steps.windows-gate.outputs', 'steps.audit.outputs', '|| true',
          )
          found = [token for token in forbidden if token in workflow]
          if found:
              raise SystemExit(f'forbidden fail-open constructs remain: {found}')
          workflows = sorted(path.name for path in Path('.github/workflows').glob('*.y*ml'))
          if workflows != ['ci.yml']:
              raise SystemExit(f'unexpected permanent workflows: {workflows}')
          PY
          git diff --exit-code
          git diff --check
      - name: Prove sole remote main branch
        run: |
          set -euo pipefail
          git ls-remote --heads origin > /tmp/dft-v4-branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [line.split()[1] for line in Path('/tmp/dft-v4-branches.txt').read_text().splitlines() if line.strip()]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
      - name: Package exact candidate
        id: bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/dft-v4-candidate"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          : > "$bundle/DELETE_PATHS.txt"
          while IFS=$'\t' read -r status path; do
            case "$status" in
              A|M)
                mkdir -p "$bundle/$(dirname "$path")"
                cp "$path" "$bundle/$path"
                ;;
              D)
                printf '%s\n' "$path" >> "$bundle/DELETE_PATHS.txt"
                ;;
              *) exit 2 ;;
            esac
          done < <(git diff-tree --no-commit-id --name-status -r HEAD)
          git rev-parse HEAD^ > "$bundle/PARENT_SHA.txt"
          git rev-parse HEAD > "$bundle/CANDIDATE_SHA.txt"
          git diff-tree --no-commit-id --name-status -r HEAD > "$bundle/CHANGES.tsv"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dft-v4-exact-candidate-${{ steps.candidate.outputs.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_DFT_EXACT_EXPORT_V2 outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} bundle=uploaded direct_failure=true evidence_upload=preserved native_tests=true controller=removed workflows=ci-only branch=main-only"

name: One-shot idempotent trust typing repair

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-idempotent-typing-repair
  cancel-in-progress: false

jobs:
  repair:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: apply idempotent trust typing repair' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/typing-repair \
            -f description="Idempotent trust typing repair running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install reviewed environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Apply idempotent typing repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('skills/tsao-dft-hpc-provenance')

          def read(path: Path) -> list[str]:
              return path.read_text(encoding='utf-8').splitlines(keepends=True)

          def write(path: Path, lines: list[str]) -> None:
              path.write_text(''.join(lines), encoding='utf-8')

          def replace_exact_line(path: Path, old: str, new_lines: list[str], already: str) -> None:
              lines = read(path)
              if any(already in line for line in lines):
                  return
              indexes = [index for index, line in enumerate(lines) if line.strip() == old]
              if len(indexes) != 1:
                  raise SystemExit(f'expected one target in {path}, found {len(indexes)}: {old}')
              index = indexes[0]
              indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              lines[index:index + 1] = [indent + item + '\n' for item in new_lines]
              write(path, lines)

          inventory = ROOT / 'scripts/inspect_execution_environment.py'
          lines = read(inventory)
          if not any(line.strip() == 'report = (' for line in lines[lines.index(next(line for line in lines if line.startswith('def main()'))):]):
              main_index = next(i for i, line in enumerate(lines) if line.startswith('def main()'))
              start = next(i for i in range(main_index, len(lines)) if lines[i].strip() == 'if errors:')
              end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'rendered = (')
              candidate = ''.join(lines[start:end])
              if '"inventory": report' not in candidate or 'else:' not in candidate:
                  raise SystemExit('inventory SIM108 target failed structural validation')
              lines[start:end] = [
                  '    report = (\n',
                  '        {"ok": False, "errors": errors, "inventory": report}\n',
                  '        if errors\n',
                  '        else {"ok": True, "inventory": report}\n',
                  '    )\n',
              ]
              write(inventory, lines)

          replace_exact_line(
              ROOT / 'scripts/engine_parser_contract.py',
              'vector = []',
              ['vector: list[float] = []'],
              'vector: list[float]',
          )

          shell = ROOT / 'scripts/shell_contract.py'
          lines = read(shell)
          if not any('signature_value = attestation.get("signature")' in line for line in lines):
              index = next(
                  i
                  for i, line in enumerate(lines)
                  if line.strip() == 'signature = base64.b64decode(attestation.get("signature"), validate=True)'
              )
              indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              expected = [
                  'signature = base64.b64decode(attestation.get("signature"), validate=True)',
                  'key = serialization.load_pem_public_key(public_key_pem)',
                  'if not isinstance(key, Ed25519PublicKey):',
                  'raise ValueError("review key must be Ed25519")',
                  'key.verify(signature, canonical_json(unsigned).encode("utf-8"))',
              ]
              observed = [lines[index + offset].strip() for offset in range(5)]
              if observed != expected:
                  raise SystemExit(f'shell signature target changed: {observed}')
              lines[index:index + 5] = [
                  indent + 'signature_value = attestation.get("signature")\n',
                  indent + 'if not isinstance(signature_value, str):\n',
                  indent + '    raise ValueError("attestation signature must be base64 text")\n',
                  indent + 'signature = base64.b64decode(signature_value, validate=True)\n',
                  indent + 'public_key = serialization.load_pem_public_key(public_key_pem)\n',
                  indent + 'if not isinstance(public_key, Ed25519PublicKey):\n',
                  indent + '    raise ValueError("review key must be Ed25519")\n',
                  indent + 'public_key.verify(signature, canonical_json(unsigned).encode("utf-8"))\n',
              ]
              write(shell, lines)

          manifest_validator = ROOT / 'scripts/validate_hpc_manifest.py'
          lines = read(manifest_validator)
          if not any('errors: list[str] = ["manifest root must be a mapping"]' in line for line in lines):
              index = next(
                  i for i, line in enumerate(lines) if line.strip() == 'errors, warnings = ["manifest root must be a mapping"], []'
              )
              indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              lines[index:index + 1] = [
                  indent + 'errors: list[str] = ["manifest root must be a mapping"]\n',
                  indent + 'warnings: list[str] = []\n',
              ]
              write(manifest_validator, lines)

          class_attributes = {
              ROOT / 'tests/test_engine_parser_contract.py': (
                  'class EngineParserContractTests(unittest.TestCase):',
                  ['    core: Any\n', '    schema: dict[str, Any]\n', '\n'],
                  '    core: Any',
              ),
              ROOT / 'tests/test_benchmark_bridge.py': (
                  'class BenchmarkBridgeTests(unittest.TestCase):',
                  ['    bridge: Any\n', '    parser: Any\n', '\n'],
                  '    bridge: Any',
              ),
              ROOT / 'tests/test_shell_trust_boundary.py': (
                  'class ShellTrustBoundaryTests(unittest.TestCase):',
                  ['    validator: Any\n', '    generator: Any\n', '    base: dict[str, Any]\n', '\n'],
                  '    validator: Any',
              ),
              ROOT / 'tests/test_evidence_trust_boundary.py': (
                  'class EvidenceTrustBoundaryTests(unittest.TestCase):',
                  [
                      '    trust: Any\n',
                      '    shell: Any\n',
                      '    performance: Any\n',
                      '    result_schema: dict[str, Any]\n',
                      '    policy_schema: dict[str, Any]\n',
                      '    policy: dict[str, Any]\n',
                      '\n',
                  ],
                  '    trust: Any',
              ),
          }
          for path, (class_line, attributes, marker) in class_attributes.items():
              lines = read(path)
              if any(line.rstrip('\n') == marker for line in lines):
                  continue
              index = next(i for i, line in enumerate(lines) if line.strip() == class_line)
              lines[index + 1:index + 1] = attributes
              write(path, lines)
          PY
          python -m ruff check --fix .
          python -m ruff format .
          git checkout e94340da02ca62d43b410235a5628cb696dd2e24 -- .github/workflows/ci.yml
          rm -f .github/workflows/ruff-repair-once.yml .github/ruff-repair.trigger

      - name: Run complete quality gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_gate.py 2>&1 | tee idempotent-typing-quality.log

      - name: Commit and push net repair
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close trust typing and formatting gates"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            python scripts/quality_gate.py 2>&1 | tee "idempotent-typing-rebased-${attempt}.log"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Idempotent trust typing repair failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Idempotent trust typing repair passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/typing-repair \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idempotent-typing-repair-${{ github.sha }}
          path: idempotent-typing-*.log
          if-no-files-found: warn
          retention-days: 14

name: Apply comprehensive skill-native V18

on:
  push:
    branches: [main]
    paths:
      - .tsao-skill-native-v18/**
      - scripts/apply_tsao_skill_native_v18.py
      - .github/workflows/apply-tsao-skill-native-v18.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tsao-dft-skill-native-v18
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Apply complete V18 scientific-core payload
        run: python scripts/apply_tsao_skill_native_v18.py
      - name: Normalize the generated V18 digest typing site
        run: python .tsao-skill-native-v18/pre_repair_hotfix.py
      - name: Repair generated V18 typing, dependency, and test-runner contracts
        run: python .tsao-skill-native-v18/repair_mypy_contracts.py
      - name: Synchronize the repaired dependency contract
        run: python .tsao-skill-native-v18/post_repair_hotfix.py
      - name: Remove one-shot and obsolete workflow surfaces before validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tsao-skill-native-v18
          rm -f scripts/apply_tsao_skill_native_v18.py
          rm -f .github/workflows/apply-tsao-skill-native-v18.yml
          rm -f .github/workflows/capture-dft-v18-generated.yml
          rm -f .github/workflows/apply-skill-native-v15-fix1.yml
          rm -f .github/workflows/apply-skill-native-v15-fix2.yml
          rm -f .github/workflows/branch-hygiene-v15.yml
          rm -f .github/workflows/contracts-v17.yml
      - name: Install locked quality environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check
      - name: Prove pytest discovery and focused scientific contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --collect-only -q -p no:cacheprovider --import-mode=importlib tests 2>&1 | tee /tmp/v18-collect.log
          python -m pytest -q -p no:cacheprovider --import-mode=importlib \
            tests/test_parser_tst_v4.py \
            tests/test_v4_dft_contracts.py \
            tests/test_v4_dft_scientific_contracts.py \
            tests/test_v5_dft_evidence_and_uncertainty.py \
            tests/test_v5_model_acceptance.py \
            tests/test_v6_scientific_acceptance_gate.py \
            tests/test_v7_execution_and_scientific_acceptance.py \
            2>&1 | tee /tmp/v18-focused.log
      - name: Run authoritative repository quality gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_gate.py 2>&1 | tee /tmp/v18-quality-gate.log
      - name: Clean ignored runtime outputs
        shell: bash
        run: git clean -fdX
      - name: Commit verified V18 source to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected V18 source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: close DFT parser, TST, ML, quantity, typing, and pytest contracts V18'
          git push origin HEAD:main
      - name: Close the deduplicated remediation issue with exact run evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 29 --body "V18 source closure succeeded. workflow_run=${{ github.run_id }} source_commit=${{ github.sha }}. The pushed final commit is the current main head; the one-shot workflow and staged payload were deleted before qualification."
          gh issue close 29 --reason completed
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dft-v18-failure-${{ github.run_id }}
          path: |
            /tmp/v18-collect.log
            /tmp/v18-focused.log
            /tmp/v18-quality-gate.log
            requirements-dev.txt
            pyproject.toml
            constraints/py312.txt
            scripts/run_all_tests.py
            scripts/run_coverage.py
            skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py
            skills/tsao-dft-hpc-provenance/scripts/engine_parser_contract_v4.py
            skills/tsao-dft-hpc-provenance/scripts/engine_parser_v4.py
            skills/tsao-dft-kinetics-multiscale/scripts/tst_standard_state_v4.py
          if-no-files-found: warn
          retention-days: 7
      - name: Update the deduplicated remediation issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 29 --body "V18 source closure failed. workflow_run=${{ github.run_id }} source_commit=${{ github.sha }}. Download artifact dft-v18-failure-${{ github.run_id }} for the exact logs."

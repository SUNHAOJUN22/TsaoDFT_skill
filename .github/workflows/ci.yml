name: One-shot acceleration evidence test formatting

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-acceleration-evidence-formatting
  cancel-in-progress: false

jobs:
  format-and-test:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: format acceleration evidence edge tests' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Format and verify acceleration evidence tests
        run: |
          targets=(
            skills/tsao-dft-hpc-provenance/tests/test_release_acceleration_planner_edges.py
            skills/tsao-dft-hpc-provenance/tests/test_release_autotuning_edges.py
            skills/tsao-dft-hpc-provenance/tests/test_release_performance_evidence_edges.py
          )
          python -m ruff check --fix "${targets[@]}"
          python -m ruff format "${targets[@]}"
          python -m ruff check "${targets[@]}"
          python -m ruff format --check "${targets[@]}"
          python -m mypy "${targets[@]}"
          for target in "${targets[@]}"; do
            python -m unittest discover -s "$(dirname "$target")" -p "$(basename "$target")" -v
          done

      - name: Commit formatted test files only
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/tsao-dft-hpc-provenance/tests/test_release_acceleration_planner_edges.py \
            skills/tsao-dft-hpc-provenance/tests/test_release_autotuning_edges.py \
            skills/tsao-dft-hpc-provenance/tests/test_release_performance_evidence_edges.py
          git commit -m "style: format acceleration evidence edge tests"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

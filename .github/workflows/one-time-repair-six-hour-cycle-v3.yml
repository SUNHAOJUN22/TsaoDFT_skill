name: One-time repair DFT six-hour cycle v3

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  repair-and-restart:
    if: contains(github.event.head_commit.message || '', '[run-dft-cycle-repair-v3]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Repair deterministic cycle without lowering quality gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          active_path = Path('.github/workflows/one-time-six-hour-active.yml')
          text = active_path.read_text(encoding='utf-8')

          if text.count('/run-six-hour-active-v2') != 3:
              raise SystemExit('DFT command count drifted')
          text = text.replace(
              '/run-six-hour-active-v2',
              '/run-six-hour-active-v3',
          )

          redundant = '          python -m pytest -q\n'
          if text.count(redundant) != 2:
              raise SystemExit('redundant pytest command count drifted')
          text = text.replace(redundant, '')

          if text.count('python scripts/quality_gate.py') != 2:
              raise SystemExit('quality gate command count drifted')
          if text.count('python -m pip check') != 4:
              raise SystemExit('dependency check count drifted')
          if 'python -m pytest -q' in text:
              raise SystemExit('redundant pytest invocation remains')

          active_path.write_text(text, encoding='utf-8')
          for relative in (
              '.github/workflows/one-time-fix-six-hour-active.yml',
              '.github/workflows/one-time-repair-six-hour-cycle-v3.yml',
          ):
              path = Path(relative)
              if path.exists():
                  path.unlink()
          PY
          git diff --check

      - name: Publish repaired cycle
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: rely on complete DFT quality gate in soak cycle"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restart six-hour qualification from zero
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 15
          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body '/run-six-hour-active-v3'

      - name: Record repair result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "DFT_SIX_HOUR_CYCLE_REPAIR_V3: **${{ job.status }}**

- repaired harness commit: \`${PUBLISHED_SHA:-UNPUBLISHED}\`
- immutable tested source remains: \`84c0a64a988a36f7b545e5af7409a81a237c4605\`
- next command: \`/run-six-hour-active-v3\`
- failed run \`31282573725\` contributes \`0 ns\`

The complete quality gate remains in every cycle; only the redundant call to an undeclared pytest module was removed."

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsao-dft-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/generate_readme_demos.py
      - run: git diff --exit-code -- assets/demo
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_ai_assets.py
      - run: python scripts/validate_readme_visuals.py --strict
      - run: python scripts/validate_repo.py --strict
      - run: python scripts/run_all_tests.py

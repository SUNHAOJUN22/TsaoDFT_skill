<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc" >
<title id="title">TsaoDFT auditable research loop</title><desc id="desc">Synthetic workflow diagram showing evidence gates and artifact ownership; not scientific data.</desc>

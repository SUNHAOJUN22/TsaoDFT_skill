"700" dy="0">Technical</tspan><tspan x="700" dy="22">scientific</tspan></text><line x1="876" y1="182" x2="896" y2="182" stroke="#D9E2EE" stroke-width="3"/><path d="M890 176 L898 182 L890 188" fill="none" stroke="#526175" stroke-width="2"/><rect x="898" y="118" width="194" height="130" rx="16" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><rect x="898" y="118" width="194" height="8" rx="16" fill="#16A34A"/><text x="916" y="154" class="label">CLAIM</text><text x="916" y="183" class="body"><tspan x="916" dy="0">Scope</tspan><tspan x="916" dy="22">evidence grade</tspan></text><rect x="34" y="278" width="1078" height="92" rx="16" fill="#101A2D"/><text x="56" y="311" class="eyebrow" style="fill:#93C5FD">EVIDENCE LEDGER</text><text x="56" y="343" class="small" style="fill:#D7E4F5">artifact hash</text><text x="250" y="343" class="small" style="fill:#D7E4F5">method fingerprint</text><text x="474" y="343" class="small" style="fill:#D7E4F5">acceptance status</text><text x="680" y="343" class="small" style="fill:#D7E4F5">unresolved assumptions</text><text x="930" y="343" class="small" style="fill:#D7E4F5">claim boundary</text><line x1="192" y1="330" x2="224" y2="330" stroke="#2563EB" stroke-width="3"/><line x1="410" y1="330" x2="442" y2="330" stroke="#0891B2" stroke-width="3"/><line x1="620" y1="330" x2="652" y2="330" stroke="#6D5DFB" stroke-width="3"/><line x1="864" y1="330" x2="896" y2="330" stroke="#D97706" stroke-width="3"/><text x="1152" y="412" class="tiny" text-anchor="end">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>

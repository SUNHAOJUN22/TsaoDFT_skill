name: One-shot Ruff formatter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ruff-format-once.yml
      - skills/tsao-dft-hpc-provenance/scripts/plan_acceleration.py

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.15.22"
      - name: Format planner
        run: python -m ruff format skills/tsao-dft-hpc-provenance/scripts/plan_acceleration.py
      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet -- skills/tsao-dft-hpc-provenance/scripts/plan_acceleration.py; then
            echo "Planner is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/tsao-dft-hpc-provenance/scripts/plan_acceleration.py
          git commit -m "style: format acceleration planner"
          git push origin HEAD:main

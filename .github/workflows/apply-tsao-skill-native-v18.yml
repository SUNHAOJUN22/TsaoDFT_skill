name: Apply comprehensive skill-native V18

on:
  push:
    branches: [main]
    paths:
      - .tsao-skill-native-v18/**
      - scripts/apply_tsao_skill_native_v18.py
      - .github/workflows/apply-tsao-skill-native-v18.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tsao-dft-skill-native-v18
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Apply verified V18 scientific-core payload
        run: python scripts/apply_tsao_skill_native_v18.py
      - name: Remove one-shot and obsolete workflow surfaces before validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tsao-skill-native-v18
          rm -f scripts/apply_tsao_skill_native_v18.py
          rm -f .github/workflows/apply-tsao-skill-native-v18.yml
          rm -f .github/workflows/apply-skill-native-v15-fix1.yml
          rm -f .github/workflows/apply-skill-native-v15-fix2.yml
          rm -f .github/workflows/branch-hygiene-v15.yml
          rm -f .github/workflows/contracts-v17.yml
      - name: Install locked quality environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check
      - name: Normalize V18 scientific and test surfaces
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/  # type: ignore\[index\]//g' tests/test_v5_dft_evidence_and_uncertainty.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/test_v5_dft_evidence_and_uncertainty.py"): {
                  '    leakage = _labels(); leakage[1]["parent_id"] = "p1"': (
                      '    leakage = _labels()\n'
                      '    leakage[1]["parent_id"] = "p1"'
                  ),
                  '    mixed = _labels(); mixed[1]["method_fingerprint"] = "4" * 64': (
                      '    mixed = _labels()\n'
                      '    mixed[1]["method_fingerprint"] = "4" * 64'
                  ),
                  '    constant = _labels(); constant[1]["value"] = -1.0': (
                      '    constant = _labels()\n'
                      '    constant[1]["value"] = -1.0'
                  ),
                  '    self_approved = _accepted_card(); self_approved["independent_approval"]["issuer"] = "trainer-a"': (
                      '    self_approved = _accepted_card()\n'
                      '    self_approved["independent_approval"]["issuer"] = "trainer-a"'
                  ),
                  '    wrong_hash = _accepted_card(); wrong_hash["independent_approval"]["model_sha256"] = "9" * 64': (
                      '    wrong_hash = _accepted_card()\n'
                      '    wrong_hash["independent_approval"]["model_sha256"] = "9" * 64'
                  ),
              },
              Path("tests/test_v7_execution_and_scientific_acceptance.py"): {
                  'SHA = lambda c: c * 64': (
                      'def sha(char: str) -> str:\n'
                      '    return char * 64'
                  ),
                  '    bad = parser_record(); bad["parser_accepted"] = False; bad["status"] = "FATAL"': (
                      '    bad = parser_record()\n'
                      '    bad["parser_accepted"] = False\n'
                      '    bad["status"] = "FATAL"'
                  ),
              },
          }
          for path, path_replacements in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in path_replacements.items():
                  if old not in text:
                      raise SystemExit(f"expected generated pattern is missing in {path}: {old}")
                  text = text.replace(old, new, 1)
              if path.name == "test_v7_execution_and_scientific_acceptance.py":
                  text = text.replace("SHA(", "sha(")
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
          targets=(
            skills/tsao-dft-hpc-provenance/scripts/contracts_v17.py
            tests/test_scientific_contracts_v16.py
            tests/test_parser_tst_v4.py
            tests/test_v4_dft_contracts.py
            tests/test_v4_dft_scientific_contracts.py
            tests/test_v5_dft_evidence_and_uncertainty.py
            tests/test_v5_model_acceptance.py
            tests/test_v6_scientific_acceptance_gate.py
            tests/test_v7_execution_and_scientific_acceptance.py
          )
          python -m ruff check "${targets[@]}" --fix --unsafe-fixes --exit-zero
          python -m ruff format "${targets[@]}"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_v7_execution_and_scientific_acceptance.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          prefixes = (
              "from execution_evidence_v7 import",
              "from scientific_acceptance_gate_v7 import",
          )
          found: set[str] = set()
          for index, line in enumerate(lines):
              stripped = line.lstrip()
              for prefix in prefixes:
                  if stripped.startswith(prefix):
                      found.add(prefix)
                      if "# noqa: E402" not in line:
                          lines[index] = (
                              line
                              + "  # noqa: E402 -- imported after repository-local path bootstrap"
                          )
          missing = set(prefixes) - found
          if missing:
              raise SystemExit(f"generated V18 imports are missing: {sorted(missing)}")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
          python -m ruff check "${targets[@]}"
          python -m ruff format --check "${targets[@]}"
          git diff --check
      - name: Run authoritative repository quality gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_gate.py 2>&1 | tee /tmp/v18-quality-gate.log
      - name: Clean ignored runtime outputs
        shell: bash
        run: git clean -fdX
      - name: Commit verified V18 source to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected V18 source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: close DFT parser, TST, ML, and quantity contracts V18'
          git push origin HEAD:main
      - name: Open diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf 'Workflow run: %s/actions/runs/%s\nCommit: %s\n' '${{ github.server_url }}/${{ github.repository }}' '${{ github.run_id }}' '${{ github.sha }}' > /tmp/v18-failure.txt
          for log in /tmp/v18-*.log; do
            if [[ -f "$log" ]]; then
              printf '\n===== %s =====\n' "$(basename "$log")" >> /tmp/v18-failure.txt
              tail -n 240 "$log" >> /tmp/v18-failure.txt
            fi
          done
          gh issue create --title 'V18 remediation failed (run ${{ github.run_id }})' --body-file /tmp/v18-failure.txt

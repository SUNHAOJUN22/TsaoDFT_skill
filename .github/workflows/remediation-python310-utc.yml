name: One-shot Python 3.10 UTC compatibility remediation

on:
  push:
    branches:
      - remediation/permanent-ci-governance

permissions:
  contents: write

concurrency:
  group: dft-python310-utc-remediation
  cancel-in-progress: false

jobs:
  repair-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/permanent-ci-governance
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py310.txt

      - name: Install locked Python 3.10 validation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py310.txt -r requirements-dev.txt
          python -m pip check

      - name: Apply timezone.utc compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py'),
              Path('tests/test_v5_model_acceptance.py'),
              Path('tests/test_v7_execution_and_scientific_acceptance.py'),
          )
          old = 'from datetime import UTC, datetime'
          new = 'from datetime import datetime, timezone\n\nUTC = timezone.utc'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one UTC import in {path}; found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/remediation-python310-utc.yml
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py \
            tests/test_v5_model_acceptance.py \
            tests/test_v7_execution_and_scientific_acceptance.py
          git diff --check

      - name: Run Python 3.10 exact qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy \
            skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py \
            tests/test_v5_model_acceptance.py \
            tests/test_v7_execution_and_scientific_acceptance.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_v5_model_acceptance.py \
            tests/test_v7_execution_and_scientific_acceptance.py \
            skills/tsao-dft-hpc-provenance/tests/test_scientific_contracts_v18.py
          python scripts/quality_gate.py

      - name: Verify and commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/remediation-python310-utc.yml',
              'skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py',
              'tests/test_v5_model_acceptance.py',
              'tests/test_v7_execution_and_scientific_acceptance.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected repair diff: expected={sorted(expected)!r} actual={sorted(actual)!r}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(py310): use timezone.utc in scientific contracts"
          git push origin HEAD:remediation/permanent-ci-governance

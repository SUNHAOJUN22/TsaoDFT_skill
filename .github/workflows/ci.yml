name: Apply exact Ruff formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-audited-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned formatter
        run: python -m pip install -r requirements-dev.txt

      - name: Apply exact formatting
        run: |
          python -m ruff format \
            scripts/validate_dependencies.py \
            scripts/quality_gate.py \
            tests/test_dependency_contract.py \
            tests/test_quality_gate.py
          python -m ruff check \
            scripts/validate_dependencies.py \
            scripts/quality_gate.py \
            tests/test_dependency_contract.py \
            tests/test_quality_gate.py

      - name: Commit formatted sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/validate_dependencies.py \
            scripts/quality_gate.py \
            tests/test_dependency_contract.py \
            tests/test_quality_gate.py
          if git diff --cached --quiet; then
            echo 'Audited files already match Ruff formatting.'
          else
            git commit -m 'style: apply pinned Ruff formatting to quality audit files [skip ci]'
            git push origin HEAD:main
          fi

name: One-shot DFT closure qualification

on:
  push:
    branches: [closure/20260828-code-readme]

permissions:
  contents: write

concurrency:
  group: dft-closure-20260828
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: closure/20260828-code-readme
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Apply reviewed non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > /tmp/closure.patch.gz <<'PATCH'
          
          PATCH
          printf '%s  %s\n' fe333927ae3eee75917d12d2bbbffd391f8a096188cbb4a2348e424b6cc57a53 /tmp/closure.patch.gz | sha256sum --check
          gzip -dc /tmp/closure.patch.gz > /tmp/closure.patch
          git apply --index --binary /tmp/closure.patch
      - name: Qualify parser-helper closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip check
          python scripts/quality_gate.py
          git diff --check
      - name: Commit qualified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(closure): share streaming parser utilities and update README boundaries'
          git push origin HEAD:closure/20260828-code-readme

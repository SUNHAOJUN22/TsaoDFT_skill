name: TsaoDFT one-shot real-evidence documentation sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Apply asserted documentation patch
        env:
          PATCH_GZ_B64: ""
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/sync_real_evidence_docs.py
          python /tmp/sync_real_evidence_docs.py
      - name: Commit documentation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md README_EN.md CHANGELOG.md \
            docs/PERFORMANCE_GUIDE.md docs/ENGINE_SUPPORT_MATRIX.md \
            docs/TEST_REPORT.md docs/CODE_QUALITY_AUDIT.md docs/REPOSITORY_FULL_AUDIT.md
          git commit -m "docs: publish real benchmark evidence qualification"
          git push origin HEAD:main

name: Current-main README and visual refresh

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: current-main-readme-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.comment.body, '/refresh-current-main-readme-v2'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt
      - name: Install locked quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check
      - name: Generate localized design and restore single-workflow policy
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --write
          node scripts/refresh-current-main-readme.mjs --check
          rm .github/workflows/current-main-readme-refresh.yml
          git diff --check
      - name: Create local exact-tree candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/current-main-readme-refresh.yml \
            README.md \
            README_EN.md \
            docs/CURRENT_MAIN_ACCEPTANCE.md \
            docs/current-main
          git commit -m 'docs: publish current-main bilingual acceptance design'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Run complete DFT quality, numerical and evidence gate
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/quality_gate.py
          python scripts/build_release_acceptance.py --help >/dev/null
          python scripts/capture_compute_contract_evidence.py --help >/dev/null
          git diff --check
      - name: Rebase and publish candidate
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Publish refresh result to issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
        run: |
          gh issue comment "$ISSUE" --body "CURRENT_MAIN_README_REFRESH_V2 outcome=${OUTCOME} changed=${CHANGED:-unknown} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} controller=self_removed"

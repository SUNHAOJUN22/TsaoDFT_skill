name: One-shot acceleration architecture refactor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/architecture-refactor.yml"

permissions:
  contents: write

jobs:
  refactor-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a3f0c85aaf31f6e17e55767b0908d7e5c2e53307 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply canonical registry integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          hpc = root / "skills" / "tsao-dft-hpc-provenance" / "scripts"

          plan_path = hpc / "plan_acceleration.py"
          plan = plan_path.read_text(encoding="utf-8")
          start = plan.index("BACKEND_BY_VENDOR = {")
          end = plan.index("COMMANDS = {", start)
          replacement = '''def _load_acceleration_registry() -> Any:
              path = Path(__file__).with_name("acceleration_registry.py")
              spec = importlib.util.spec_from_file_location("tsao_plan_acceleration_registry", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot import {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          _REGISTRY = _load_acceleration_registry()
          BACKEND_BY_VENDOR = dict(_REGISTRY.BACKEND_BY_VENDOR)
          BACKEND_VENDORS = {name: set(_REGISTRY.BACKEND_VENDORS[name]) for name in BACKENDS}
          LIBRARIES: dict[str, dict[str, str]] = _REGISTRY.plan_libraries()
          ALIASES: dict[str, str] = _REGISTRY.plan_aliases()
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line for line in replacement.splitlines()
          ) + "\n"
          plan = plan[:start] + replacement + plan[end:]
          plan_path.write_text(plan, encoding="utf-8")

          contract_path = hpc / "hardware_optimization_contract.py"
          contract = contract_path.read_text(encoding="utf-8")
          contract = contract.replace(
              "import math\nimport re\nfrom typing import Any\n",
              "import importlib.util\nimport math\nimport re\nfrom pathlib import Path\nfrom typing import Any\n",
              1,
          )
          start = contract.index("BACKEND_VENDORS = {")
          end = contract.index("def normalize_library(value: str) -> str:", start)
          replacement = '''def _load_acceleration_registry() -> Any:
              path = Path(__file__).with_name("acceleration_registry.py")
              spec = importlib.util.spec_from_file_location("tsao_optimizer_acceleration_registry", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot import {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          _REGISTRY = _load_acceleration_registry()
          BACKEND_VENDORS = {name: set(_REGISTRY.BACKEND_VENDORS[name]) for name in BACKENDS}
          LIBRARIES: dict[str, dict[str, str]] = _REGISTRY.optimizer_libraries()
          ALIASES: dict[str, str] = _REGISTRY.optimizer_aliases()


          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line for line in replacement.splitlines()
          ) + "\n"
          contract = contract[:start] + replacement + contract[end:]
          contract_path.write_text(contract, encoding="utf-8")

          gate_path = root / "scripts" / "quality_gate.py"
          gate = gate_path.read_text(encoding="utf-8")
          if "scripts/validate_acceleration_registry.py" not in gate:
              anchor = '        Stage("packaging model", (sys.executable, "scripts/validate_packaging_model.py")),\n'
              registry_stage = (
                  '        Stage(\n'
                  '            "acceleration registry",\n'
                  '            (sys.executable, "scripts/validate_acceleration_registry.py"),\n'
                  '        ),\n'
              )
              if anchor not in gate:
                  raise RuntimeError("quality gate packaging-model anchor not found")
              gate = gate.replace(anchor, registry_stage + anchor, 1)
          gate_path.write_text(gate, encoding="utf-8")
          PY

      - name: Format and generate executable audit
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            scripts/audit_compute_architecture.py \
            scripts/quality_gate.py \
            skills/tsao-dft-hpc-provenance/scripts/plan_acceleration.py \
            skills/tsao-dft-hpc-provenance/scripts/hardware_optimization_contract.py \
            tests/test_compute_architecture_audit.py
          python scripts/audit_compute_architecture.py \
            --json-out docs/EXECUTABLE_COMPUTE_ARCHITECTURE_AUDIT.json \
            --markdown-out docs/EXECUTABLE_COMPUTE_ARCHITECTURE_AUDIT.md

      - name: Run full quality gate
        id: quality
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_gate.py --json 2>&1 | tee architecture-refactor-quality.log

      - name: Commit qualified result or diagnostic
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${QUALITY_OUTCOME}" == "success" ]]; then
            rm -f architecture-refactor-quality.log architecture-refactor-status.json
            git rm .github/workflows/architecture-refactor.yml
            git add -A
            git commit -m "refactor: unify acceleration contracts and audit compute architecture"
          else
            python - <<'PY'
            import json
            from pathlib import Path

            log = Path("architecture-refactor-quality.log").read_text(encoding="utf-8", errors="replace")
            Path("architecture-refactor-status.json").write_text(
                json.dumps(
                    {
                        "ok": False,
                        "stage": "full-quality-gate",
                        "log_tail": log[-30000:],
                    },
                    indent=2,
                )
                + "\n",
                encoding="utf-8",
            )
            PY
            git reset --hard HEAD
            git add architecture-refactor-status.json
            git commit -m "test: record acceleration refactor quality failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

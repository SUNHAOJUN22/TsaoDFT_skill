name: Apply clean TsaoDFT rebuild

on:
  push:
    branches: [main]
    paths:
      - '_maintenance/TRIGGER'

permissions:
  contents: write

concurrency:
  group: tsao-dft-clean-rebuild
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct validated source tree
        shell: bash
        run: |
          cat _maintenance/part* > /tmp/tsao.b64
          base64 --decode /tmp/tsao.b64 > /tmp/tsao.tar.gz
          echo 'cb848054ccce41a39549b98c8023429af5ad324dd4cf0eaaa76efe7e4591906a  /tmp/tsao.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/tsao-rebuilt
          tar -xzf /tmp/tsao.tar.gz -C /tmp/tsao-rebuilt
          rsync -a --delete --exclude='.git/' /tmp/tsao-rebuilt/ ./
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run complete quality gate
        run: python scripts/quality_gate.py
      - name: Publish clean rebuild to main
        shell: bash
        run: |
          test "$(git branch --show-current)" = 'main'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: clean failures, rebuild visuals and harden quality gate'
          git push origin HEAD:main

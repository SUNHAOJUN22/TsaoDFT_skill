name: One-shot domain edge repository normalization

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: tsao-domain-edge-repository-normalization
  cancel-in-progress: false

jobs:
  normalize:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: remove local path from domain edge tests' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=tsao-dft/domain-edge-repository \
            -f description="Domain edge repository normalization running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Replace local absolute command fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_release_domain_validator_edges.py')
          text = path.read_text(encoding='utf-8')
          old = '            with patch.object(env, "resolve_command", return_value="/bin/tool"):\n'
          new = '            with patch.object(env, "resolve_command", return_value="tool"):\n'
          if old not in text:
              raise SystemExit('domain edge absolute command fixture target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          target=tests/test_release_domain_validator_edges.py
          python -m ruff check "$target"
          python -m ruff format --check "$target"
          python -m mypy "$target"
          python -m unittest discover -s tests -p 'test_release_domain_validator_edges.py' -v
          python scripts/validate_ignore_markers.py
          python scripts/validate_repo.py --strict --json
          python scripts/install.py --dry-run

      - name: Commit and push test file only
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_release_domain_validator_edges.py
          git commit -m "test: remove local path from domain edge coverage"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Domain edge repository normalization failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Domain edge repository checks passed and were pushed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=tsao-dft/domain-edge-repository \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

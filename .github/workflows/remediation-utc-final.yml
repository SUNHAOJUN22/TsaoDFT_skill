name: One-shot DFT residual UTC finalization

on:
  push:
    branches:
      - remediation/scientific-contracts-v9

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/scientific-contracts-v9
          fetch-depth: 0
      - name: Commit residual Python 3.10 compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py')
          text = path.read_text(encoding='utf-8')
          old = 'datetime.now(UTC)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one residual UTC alias, found {text.count(old)}')
          text = text.replace(old, 'datetime.now(timezone.utc)')
          forbidden = (
              'from datetime import UTC',
              'tzinfo=UTC',
              '.astimezone(UTC)',
              'datetime.now(UTC)',
          )
          unresolved = [token for token in forbidden if token in text]
          if unresolved:
              raise SystemExit(f'unresolved executable UTC aliases: {unresolved!r}')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -m compileall -q skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/tsao-dft-hpc-provenance/scripts/scientific_contracts_core_v18.py
          git commit -m "fix(compat): remove residual datetime.UTC alias"
          git push origin HEAD:remediation/scientific-contracts-v9
      - name: Remove finalization workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remediation-utc-final.yml
          git add .github/workflows/remediation-utc-final.yml
          git commit -m "chore(ci): remove temporary UTC finalization workflow"
          git push origin HEAD:remediation/scientific-contracts-v9

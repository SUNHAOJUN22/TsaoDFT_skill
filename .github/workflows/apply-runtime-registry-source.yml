name: Apply runtime registry single source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-runtime-registry-source.yml"
      - ".automation/runtime-registry-source.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints/py312.txt

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/py312.txt -r requirements-dev.txt
          python -m pip check

      - name: Replace planner mirrors with runtime registry views
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          hpc = root / "skills" / "tsao-dft-hpc-provenance" / "scripts"

          plan_path = hpc / "plan_acceleration.py"
          plan = plan_path.read_text(encoding="utf-8")
          if "def _load_acceleration_registry()" not in plan:
              start = plan.index("BACKEND_BY_VENDOR = {")
              end = plan.index("COMMANDS = {", start)
              replacement = '''def _load_acceleration_registry() -> Any:
              path = Path(__file__).with_name("acceleration_registry.py")
              spec = importlib.util.spec_from_file_location("tsao_plan_acceleration_registry", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot import {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          _REGISTRY = _load_acceleration_registry()
          BACKEND_BY_VENDOR = dict(_REGISTRY.BACKEND_BY_VENDOR)
          BACKEND_VENDORS = {name: set(_REGISTRY.BACKEND_VENDORS[name]) for name in BACKENDS}
          LIBRARIES: dict[str, dict[str, str]] = _REGISTRY.plan_libraries()
          ALIASES: dict[str, str] = _REGISTRY.plan_aliases()


          '''
              replacement = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in replacement.splitlines()
              ) + "\n"
              plan_path.write_text(plan[:start] + replacement + plan[end:], encoding="utf-8")

          contract_path = hpc / "hardware_optimization_contract.py"
          contract = contract_path.read_text(encoding="utf-8")
          if "def _load_acceleration_registry()" not in contract:
              old_imports = "import math\nimport re\nfrom typing import Any\n"
              new_imports = "import importlib.util\nimport math\nimport re\nfrom pathlib import Path\nfrom typing import Any\n"
              if old_imports not in contract:
                  raise RuntimeError("hardware optimizer import anchor not found")
              contract = contract.replace(old_imports, new_imports, 1)
              start = contract.index("BACKEND_VENDORS = {")
              end = contract.index("def normalize_library(value: str) -> str:", start)
              replacement = '''def _load_acceleration_registry() -> Any:
              path = Path(__file__).with_name("acceleration_registry.py")
              spec = importlib.util.spec_from_file_location("tsao_optimizer_acceleration_registry", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot import {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          _REGISTRY = _load_acceleration_registry()
          BACKEND_VENDORS = {name: set(_REGISTRY.BACKEND_VENDORS[name]) for name in BACKENDS}
          LIBRARIES: dict[str, dict[str, str]] = _REGISTRY.optimizer_libraries()
          ALIASES: dict[str, str] = _REGISTRY.optimizer_aliases()


          '''
              replacement = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in replacement.splitlines()
              ) + "\n"
              contract_path.write_text(contract[:start] + replacement + contract[end:], encoding="utf-8")

          validator_path = root / "scripts" / "validate_acceleration_registry.py"
          validator = validator_path.read_text(encoding="utf-8")
          marker = "still defines a duplicated acceleration library catalog"
          if marker not in validator:
              anchor = "    report = registry.registry_report()\n"
              guard = '''    for path in (PLAN_PATH, CONTRACT_PATH):
              source = path.read_text(encoding="utf-8")
              if "def _library(" in source:
                  errors.append(f"{path.name} still defines a duplicated acceleration library catalog")
              if "def _load_acceleration_registry()" not in source:
                  errors.append(f"{path.name} does not load acceleration_registry.py at runtime")

          '''
              guard = "\n".join(
                  line[4:] if line.startswith("    ") else line
                  for line in guard.splitlines()
              ) + "\n"
              if anchor not in validator:
                  raise RuntimeError("acceleration validator report anchor not found")
              validator = validator.replace(anchor, guard + anchor, 1)
              validator_path.write_text(validator, encoding="utf-8")

          test_path = root / "tests" / "test_acceleration_registry_single_source.py"
          test_path.write_text(
              '''from __future__ import annotations

import importlib.util
import sys
import unittest
from pathlib import Path
from types import ModuleType

ROOT = Path(__file__).resolve().parents[1]
HPC = ROOT / "skills" / "tsao-dft-hpc-provenance" / "scripts"


def load_module(name: str, path: Path) -> ModuleType:
    spec = importlib.util.spec_from_file_location(name, path)
    if spec is None or spec.loader is None:
        raise RuntimeError(f"cannot import {path}")
    module = importlib.util.module_from_spec(spec)
    sys.modules[spec.name] = module
    spec.loader.exec_module(module)
    return module


class AccelerationRegistrySingleSourceTests(unittest.TestCase):
    def test_public_planners_load_runtime_views_from_canonical_registry(self) -> None:
        registry = load_module("tsao_single_source_registry", HPC / "acceleration_registry.py")
        plan = load_module("tsao_single_source_plan", HPC / "plan_acceleration.py")
        optimizer = load_module(
            "tsao_single_source_optimizer",
            HPC / "hardware_optimization_contract.py",
        )
        self.assertEqual(plan.LIBRARIES, registry.plan_libraries())
        self.assertEqual(plan.ALIASES, registry.plan_aliases())
        self.assertEqual(optimizer.LIBRARIES, registry.optimizer_libraries())
        self.assertEqual(optimizer.ALIASES, registry.optimizer_aliases())

    def test_planners_do_not_define_mirror_catalogs(self) -> None:
        for name in ("plan_acceleration.py", "hardware_optimization_contract.py"):
            source = (HPC / name).read_text(encoding="utf-8")
            self.assertNotIn("def _library(", source)
            self.assertIn("def _load_acceleration_registry()", source)


if __name__ == "__main__":
    unittest.main()
''',
              encoding="utf-8",
          )
          PY

      - name: Remove one-shot controls before governance checks
        run: |
          git rm .github/workflows/apply-runtime-registry-source.yml
          git rm .automation/runtime-registry-source.trigger

      - name: Format and validate milestone
        run: |
          python -m ruff format \
            skills/tsao-dft-hpc-provenance/scripts/plan_acceleration.py \
            skills/tsao-dft-hpc-provenance/scripts/hardware_optimization_contract.py \
            scripts/validate_acceleration_registry.py \
            tests/test_acceleration_registry_single_source.py
          python scripts/validate_acceleration_registry.py
          python -m unittest discover -s tests -p 'test_acceleration_registry*.py'
          python -m unittest discover -s skills/tsao-dft-hpc-provenance/tests -p 'test_acceleration_planner.py'
          python -m unittest discover -s skills/tsao-dft-hpc-provenance/tests -p 'test_hardware_aware_optimizer*.py'
          python scripts/quality_gate.py

      - name: Commit milestone directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: load planners from canonical acceleration registry"
          git pull --rebase origin main
          git push origin HEAD:main

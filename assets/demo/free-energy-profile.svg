<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc" >
<title id="title">Free-energy profile with explicit validation gates</title><desc id="desc">Synthetic free-energy profile demonstrating validation requirements; not scientific data.</desc>
<defs><pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#E9EEF5"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0B1220" flood-opacity=".08"/></filter></defs><style>
.text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0B1220}
.mono{font-family:JetBrains Mono,SFMono-Regular,Consolas,monospace;fill:#0B1220}
.eyebrow{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:800;letter-spacing:1.8px;fill:#2563EB}
.title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:32px;font-weight:780;letter-spacing:-.7px;fill:#0B1220}
.h2{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:760;fill:#0B1220}
.body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:450;fill:#526175}
.small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:500;fill:#526175}
.tiny{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:10px;font-weight:650;letter-spacing:.5px;fill:#7A889B}
.label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.9px;fill:#526175}
.mono12{font-family:JetBrains Mono,SFMono-Regular,Consolas,monospace;font-size:12px;font-weight:600;fill:#0B1220}
</style>
<rect x="0" y="0" width="1080" height="500" rx="0" fill="#F6F8FC"/><text x="32" y="42" class="eyebrow">ENERGY PROFILE</text><text x="32" y="78" class="title">Barrier plots are accepted only with explicit references and gates.</text><rect x="32" y="108" width="760" height="320" rx="18" fill="#FFFFFF" stroke="#D9E2EE" stroke-width="1"/><line x1="92" y1="370" x2="742" y2="370" stroke="#0B1220" stroke-width="2"/><line x1="92" y1="150" x2="92" y2="370" stroke="#0B1220" stroke-width="2"/><text x="58" y="155" class="mono12">ΔG</text><text x="742" y="398" class="small" text-anchor="end">reaction coordinate</text><path d="M 112 330 L 220 315 L 330 190 L 440 285 L 570 150 L 700 270" fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round"/><circle cx="112" cy="330" r="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/><text x="112" y="312" class="mono12" text-anchor="middle">R</text><circle cx="220" cy="315" r="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/><text x="220" y="297" class="mono12" text-anchor="middle">I1</text><circle cx="330" cy="190" r="8" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/><text x="330" y="172" class="mono12" text-anchor="middle">TS1</text><circle cx="440" cy="285" r="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/><text x="440" y="267" class="mono12" text-anchor="middle">I2</text><circle cx="570" cy="150" r="8" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/><text x="570" y="132" class="mono12" text-anchor="middle">TS2</text><circle cx="700" cy="270" r="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/><text x="700" y="252" class="mono12" text-anchor="middle">P</text><line x1="92" y1="330" x2="742" y2="330" stroke="#E9EEF5" stroke-width="1" stroke-dasharray="5 5"/><text x="104" y="348" class="tiny">reference state</text><rect x="816" y="108" width="232" height="320" rx="18" fill="#101A2D"/><text x="840" y="142" class="eyebrow" style="fill:#93C5FD">VALIDATION GATES</text><circle cx="842" cy="178" r="6" fill="#2563EB"/><text x="858" y="182" class="label" style="fill:#FFFFFF">STANDARD STATE</text><text x="858" y="201" class="tiny" style="fill:#B8C8DD">phase + concentration</text><circle cx="842" cy="236" r="6" fill="#0891B2"/><text x="858" y="240" class="label" style="fill:#FFFFFF">THERMOCHEMISTRY</text><text x="858" y="259" class="tiny" style="fill:#B8C8DD">temperature + corrections</text><circle cx="842" cy="294" r="6" fill="#D97706"/><text x="858" y="298" class="label" style="fill:#FFFFFF">TS EVIDENCE</text><text x="858" y="317" class="tiny" style="fill:#B8C8DD">imaginary mode + IRC</text><circle cx="842" cy="352" r="6" fill="#16A34A"/><text x="858" y="356" class="label" style="fill:#FFFFFF">CLAIM SCOPE</text><text x="858" y="375" class="tiny" style="fill:#B8C8DD">model / experiment boundary</text><text x="1052" y="482" class="tiny" text-anchor="end">SYNTHETIC DEMO · NOT SCIENTIFIC DATA</text>
</svg>